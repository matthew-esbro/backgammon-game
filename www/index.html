      },
      midnight:{
        name:'Midnight',swatch:'#182030',
        canvasBg:0x0c1018,
        boardBg:0x182030,boardBgLight:0x222a3a,boardBorder:0x384050,
        pointDark:0x141a28,pointLight:0x8a8070,
        barBg:0x101820,
        playerChecker:0xd8c080,playerCheckerLight:0xf0e0b0,
        cpuChecker:0x1a2030,cpuCheckerLight:0x303a4a,
        playerBorder:0xc0a860,cpuBorder:0x283040,
        selectGlow:0xc8a860,validGlow:0x70a080,bestGlow:0x70b080,
        midLine:0x384050,bearOffBg:0x0c1018,
        uiBg1:'#0c1018',uiBg2:'#141a24',
        uiText:'#c8c0a8',uiTextDim:'#686058',uiAccent:'#b8a060',
        uiAccentBright:'#f0c860',
        uiPanel:'rgba(12,16,24,0.85)',uiPanelBorder:'#384050',
        uiBtnActive:'linear-gradient(135deg,#8a7838,#b8a060,#8a7838)',uiBtnPassive:'rgba(30,35,50,0.5)',
        uiBtnActiveText:'#0c1018',uiTitleShadow:'0 0 20px rgba(184,160,96,0.2),2px 2px 0 #141a28',
      },
    };
    const SKIN_KEYS=Object.keys(SKINS);
    function getSkinColors(key){return SKINS[key]||SKINS.ivory}

    function BoardCanvas({gameState,uiState,onPointClick,onBarClick,onBearOffClick,scale,training,analysis,skin}){
      const canvasRef=useRef(null);
      const appRef=useRef(null);
      const containersRef=useRef({});
      const animRef=useRef(null); // for move animation
      const animatingToRef=useRef(null); // point being animated to (hide top checker there)
      const COL=getSkinColors(skin);

      // Board dimensions — fill available space, handle portrait + landscape
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const isLand=vw>vh;
      // In landscape: board + controls sit side-by-side, so board gets ~70% of width
      // In portrait: board uses full width, controls go below
      const boardAreaW=isLand?Math.floor(vw-250):vw; // landscape: reserve 250px for controls panel
      // Width constraint: TOTAL_W = BOARD_W * 1.157 + 12
      const fromWidth=Math.floor((boardAreaW-20)/1.157);
      // In landscape, also cap so board height fits viewport
      const maxFromH=isLand?Math.floor((vh-90)/0.7):9999;
      const BOARD_W=Math.min(504,fromWidth,maxFromH);
      const POINT_W=BOARD_W/14;
      const CHECKER_R=Math.min(16,POINT_W*0.44);
      const BAR_W=POINT_W;
      const BEAR_W=POINT_W*1.1;
      const TOTAL_W=BOARD_W+BEAR_W*2+12;
      // Height
      const chromeH=isLand?40:250;
      const availH=vh-chromeH;
      const maxPointH=Math.floor((availH-30)/2);
      const POINT_H=Math.max(BOARD_W*0.3,Math.min(maxPointH,BOARD_W*0.55));
      const BOARD_H=POINT_H*2+30;
      const TOTAL_H=BOARD_H+8;

      // Board layout: 6 points | bar | 6 points
      // Point columns are evenly spaced within each half
      const COL_W=(BOARD_W-BAR_W)/12;
      const boardLeft=BEAR_W+6;
      function getPointX(idx){
        // Map point index to visual position (0-5 = left half, 6-11 = right half)
        let pos;
        if(idx>=12){
          // Top row: idx 12=leftmost, idx 17=left of bar, idx 18=right of bar, idx 23=rightmost
          pos=idx-12; // 0-11
        }else{
          // Bottom row: idx 11=leftmost, idx 6=left of bar, idx 5=right of bar, idx 0=rightmost
          pos=11-idx; // 0-11
        }
        if(pos<6){
          // Left half
          return boardLeft+pos*COL_W+COL_W/2;
        }else{
          // Right half (skip bar)
          return boardLeft+6*COL_W+BAR_W+(pos-6)*COL_W+COL_W/2;
        }
      }
      function isTopPoint(idx){return idx>=12}

      // Initialize PixiJS
      useEffect(()=>{
        if(!canvasRef.current)return;
        const app=new PIXI.Application();
        let mounted=true;
        app.init({
          canvas:canvasRef.current,
          width:TOTAL_W,
          height:TOTAL_H,
          background:COL.canvasBg,
          antialias:true,
          resolution:window.devicePixelRatio||2,
          autoDensity:true,
        }).then(()=>{
          if(!mounted)return;
          appRef.current=app;
          const staticLayer=new PIXI.Container();
          const dynamicLayer=new PIXI.Container();
          app.stage.addChild(staticLayer);
          app.stage.addChild(dynamicLayer);
          containersRef.current={staticLayer,dynamicLayer};
          drawStaticBoard(staticLayer);
          updateDynamic();
        });
        return()=>{mounted=false;if(appRef.current){appRef.current.destroy(true);appRef.current=null}};
      },[]);

      // Redraw static board when skin changes
      const prevSkinRef=useRef(skin);
      useEffect(()=>{
        if(prevSkinRef.current!==skin&&appRef.current){
          prevSkinRef.current=skin;
          appRef.current.renderer.background.color=COL.canvasBg;
          const{staticLayer}=containersRef.current;
          if(staticLayer)drawStaticBoard(staticLayer);
        }
      });

      // Draw the static board (background, triangles, bar, frame)
      function drawStaticBoard(container){
        container.removeChildren();
        const g=new PIXI.Graphics();
        // Board background
        g.roundRect(BEAR_W+2,0,BOARD_W+4,BOARD_H,8);
        g.fill({color:COL.boardBg});
        g.stroke({color:COL.boardBorder,width:2});
        // Inner board glow
        const glow=new PIXI.Graphics();
        glow.roundRect(BEAR_W+4,2,BOARD_W,BOARD_H-4,6);
        glow.fill({color:COL.boardBgLight,alpha:0.15});
        container.addChild(g);
        container.addChild(glow);
        // Point triangles
        for(let i=0;i<24;i++){
          const tri=new PIXI.Graphics();
          const dark=i%2===0;
          const color=dark?COL.pointDark:COL.pointLight;
          const x=getPointX(i);
          const top=isTopPoint(i);
          const w=COL_W*0.9;
          if(top){
            tri.moveTo(x-w/2,4);tri.lineTo(x+w/2,4);tri.lineTo(x,4+POINT_H);tri.closePath();
          }else{
            tri.moveTo(x-w/2,BOARD_H-4);tri.lineTo(x+w/2,BOARD_H-4);tri.lineTo(x,BOARD_H-4-POINT_H);tri.closePath();
          }
          tri.fill({color,alpha:0.7});
          container.addChild(tri);
        }
        // Bar — centered between left 6 and right 6 points
        const bar=new PIXI.Graphics();
        const barX=boardLeft+6*COL_W+BAR_W/2;
        bar.rect(barX-BAR_W/2,0,BAR_W,BOARD_H);
        bar.fill({color:COL.barBg,alpha:0.9});
        bar.stroke({color:COL.cpuBorder,width:1,alpha:0.5});
        container.addChild(bar);
        // Mid line
        const mid=new PIXI.Graphics();
        mid.rect(BEAR_W+6,BOARD_H/2-1,BOARD_W,2);
        mid.fill({color:COL.midLine,alpha:0.4});
        container.addChild(mid);
        // Bear-off trays
        for(let p=0;p<2;p++){
          const tray=new PIXI.Graphics();
          const tx=p===1?0:BEAR_W+BOARD_W+10;
          tray.roundRect(tx,4,BEAR_W,BOARD_H-8,5);
          tray.fill({color:COL.bearOffBg,alpha:0.6});
          tray.stroke({color:COL.cpuBorder,width:1,alpha:0.5});
          container.addChild(tray);
        }
      }

      // Hit zones are handled via DOM overlay instead of PixiJS events for reliability

      // Draw dynamic elements (checkers, highlights, labels)
      function updateDynamic(){
        const{dynamicLayer}=containersRef.current;
        if(!dynamicLayer)return;
        dynamicLayer.removeChildren();
        const gs=gameState;
        const ui=uiState;
        if(!gs)return;

        // Training best-move highlights — only show FIRST move of recommended sequence
        let bestSources=new Set(),bestDests=new Set(),bestBearOff=false;
        if(training&&analysis&&analysis.best&&analysis.best.moves.length>0){
          const firstMv=analysis.best.moves[0];
          if(firstMv.from>=0)bestSources.add(firstMv.from);
          if(firstMv.to>=0&&firstMv.to<24)bestDests.add(firstMv.to);
          if(firstMv.to===-2||firstMv.to===25)bestBearOff=true;
        }

        // Draw highlights under checkers
        for(let i=0;i<24;i++){
          const x=getPointX(i);
          const top=isTopPoint(i);
          const isSelected=ui.selected===i;
          const isValidDest=ui.validDests.includes(i);
          const isBestSrc=bestSources.has(i);
          const isBestDst=bestDests.has(i);
          if(isSelected||isValidDest||isBestSrc||isBestDst){
            const hl=new PIXI.Graphics();
            // Selected=gold, valid dest=green, training FROM=orange, training TO=cyan
            let color,alpha;
            if(isSelected){color=COL.selectGlow;alpha=0.3}
            else if(isValidDest){color=COL.validGlow;alpha=0.25}
            else if(isBestSrc){color=0xe08030;alpha=0.25} // orange for FROM
            else{color=0x30a0e0;alpha=0.25} // cyan for TO
            hl.rect(x-COL_W/2,top?2:BOARD_H/2,COL_W,BOARD_H/2-2);
            hl.fill({color,alpha});
            dynamicLayer.addChild(hl);
            // Add FROM/TO labels for training highlights
            if((isBestSrc||isBestDst)&&!isSelected&&!isValidDest){
              const labelText=isBestSrc?'FROM':'TO';
              const labelColor=isBestSrc?0xe08030:0x30a0e0;
              const label=new PIXI.Text({text:labelText,style:{fontSize:Math.max(8,COL_W*0.28),fill:labelColor,fontFamily:'Georgia',fontWeight:'bold'}});
              label.anchor.set(0.5);
              label.x=x;label.y=top?BOARD_H/2-8:BOARD_H/2+8;
              dynamicLayer.addChild(label);
            }
          }
        }

        // Determine which points have movable checkers (for hint glow)
        const movablePoints=new Set();
        if(gs&&ui.selected===null&&ui.phase==='moving'&&ui.currentPlayer===0){
          // Check each player point for any valid single-die move
          for(let i=0;i<24;i++){
            if(gs.board[i]<=0)continue;
            for(const die of [...new Set(ui.remainingDice||[])]){
              const target=i-die;
              if(target>=0&&target<24&&canLand(gs.board,target,0)){movablePoints.add(i);break}
              if(target<0&&allInHome(gs,0)){
                if(target===-1||i>=highestOccupied(gs,0)){movablePoints.add(i);break}
              }
            }
          }
          // Also check bar
          if(gs.bar[0]>0)movablePoints.add(-1);
        }

        // Draw checkers on points
        const animDest=animatingToRef.current;
        for(let i=0;i<24;i++){
          let count=Math.abs(gs.board[i]);
          if(count===0)continue;
          const isPlayer=gs.board[i]>0;
          const x=getPointX(i);
          const top=isTopPoint(i);
          // Hide the top checker if it's being animated in
          const hideTop=(animDest===i&&count>0);
          const drawCount=hideTop?count-1:count;
          if(drawCount===0)continue;
          const maxShow=Math.min(drawCount,5);
          const spacing=Math.min(CHECKER_R*1.7,POINT_H/5.5);
          // Subtle glow on movable player checkers when nothing selected
          if(isPlayer&&movablePoints.has(i)&&ui.selected===null){
            const glowY=top?(10+CHECKER_R):(BOARD_H-10-CHECKER_R);
            const glow=new PIXI.Graphics();
            glow.circle(x,glowY,CHECKER_R+3);
            glow.fill({color:COL.selectGlow,alpha:0.15});
            dynamicLayer.addChild(glow);
          }
          for(let j=0;j<maxShow;j++){
            const cy=top?(10+CHECKER_R+j*spacing):(BOARD_H-10-CHECKER_R-j*spacing);
            drawChecker(dynamicLayer,x,cy,CHECKER_R,isPlayer,ui.lastMovedTo===i&&j===maxShow-1);
          }
          if(count>5){
            const labelY=top?(10+CHECKER_R+4*spacing+CHECKER_R+4):(BOARD_H-10-CHECKER_R-4*spacing-CHECKER_R-4);
            const label=new PIXI.Text({text:String(count),style:{fontSize:10*scale,fill:0xe8d5a3,fontFamily:'Georgia'}});
            label.anchor.set(0.5);label.x=x;label.y=labelY;
            dynamicLayer.addChild(label);
          }
        }

        // Draw bar checkers — centered in each half of the bar so a lone
        // barred checker is easy to spot (not pinned to the top/bottom edge).
        const barX=boardLeft+6*COL_W+BAR_W/2;
        const barSpacing=CHECKER_R*1.4;
        const barCheckerR=CHECKER_R; // full-size so it reads at a glance
        // CPU bar (top half, centered around BOARD_H/4)
        if(gs.bar[1]>0){
          const visible=Math.min(gs.bar[1],3);
          const stackTop=BOARD_H/4-(visible-1)*barSpacing/2;
          for(let j=0;j<visible;j++){
            drawChecker(dynamicLayer,barX,stackTop+j*barSpacing,barCheckerR,false,false);
          }
          if(gs.bar[1]>3){
            const label=new PIXI.Text({text:String(gs.bar[1]),style:{fontSize:10*scale,fill:0xe8d5a3,fontFamily:'Georgia',fontWeight:'bold'}});
            label.anchor.set(0.5);label.x=barX;label.y=stackTop+(visible-1)*barSpacing+barCheckerR+8;
            dynamicLayer.addChild(label);
          }
        }
        // Player bar (bottom half) with highlight
        if(ui.selected===-1){
          const bhl=new PIXI.Graphics();
          bhl.rect(barX-BAR_W/2,BOARD_H/2,BAR_W,BOARD_H/2);
          bhl.fill({color:COL.selectGlow,alpha:0.25});
          dynamicLayer.addChild(bhl);
        }
        // Player bar (bottom half, centered around BOARD_H*3/4)
        if(gs.bar[0]>0){
          const visible=Math.min(gs.bar[0],3);
          const stackTop=BOARD_H*3/4-(visible-1)*barSpacing/2;
          for(let j=0;j<visible;j++){
            drawChecker(dynamicLayer,barX,stackTop+j*barSpacing,barCheckerR,true,false);
          }
          if(gs.bar[0]>3){
            const label=new PIXI.Text({text:String(gs.bar[0]),style:{fontSize:10*scale,fill:0xe8d5a3,fontFamily:'Georgia',fontWeight:'bold'}});
            label.anchor.set(0.5);label.x=barX;label.y=stackTop-barCheckerR-8;
            dynamicLayer.addChild(label);
          }
        }

        // Bear-off trays
        for(let p=0;p<2;p++){
          const count=gs.off[p];
          const tx=p===1?BEAR_W/2:BEAR_W+BOARD_W+10+BEAR_W/2;
          const isPlayer=p===0;
          // Highlight for valid bear-off destination
          if(p===0&&ui.validDests.includes(-2)){
            const bhl=new PIXI.Graphics();
            bhl.roundRect(BEAR_W+BOARD_W+10,4,BEAR_W,BOARD_H-8,5);
            bhl.fill({color:COL.validGlow,alpha:0.2});
            dynamicLayer.addChild(bhl);
          }
          if(p===0&&bestBearOff){
            const bhl=new PIXI.Graphics();
            bhl.roundRect(BEAR_W+BOARD_W+10,4,BEAR_W,BOARD_H-8,5);
            bhl.fill({color:0x4090e0,alpha:0.15});
            dynamicLayer.addChild(bhl);
          }
          // Draw thin checker bars
          for(let j=0;j<Math.min(count,12);j++){
            const cy=isPlayer?BOARD_H-12-j*6:12+j*6;
            const bar=new PIXI.Graphics();
            bar.roundRect(tx-BEAR_W*0.35,cy-2,BEAR_W*0.7,4,2);
            bar.fill({color:isPlayer?0xdaa557:0x3a2218});
            bar.stroke({color:isPlayer?0xc8a050:0x4a3020,width:0.5});
            dynamicLayer.addChild(bar);
          }
          if(count>0){
            const numY=isPlayer?BOARD_H-12-Math.min(count,12)*6-10:12+Math.min(count,12)*6+10;
            const label=new PIXI.Text({text:String(count),style:{fontSize:10*scale,fill:0xe8d5a3,fontFamily:'Georgia'}});
            label.anchor.set(0.5);label.x=tx;label.y=numY;
            dynamicLayer.addChild(label);
          }
        }

        // Die labels on valid destinations
        if(ui.destLabels){
          for(const [ptStr,labels] of Object.entries(ui.destLabels)){
            const pt=Number(ptStr);
            if(pt===-2){
              // Bear-off labels
              const tx=BEAR_W+BOARD_W+10+BEAR_W/2;
              const dieText=labels.map(l=>l.combo||String(l.die)).join(' ');
              const label=new PIXI.Text({text:dieText,style:{fontSize:9*scale,fill:0xf0c040,fontFamily:'Georgia',fontWeight:'bold'}});
              label.anchor.set(0.5);label.x=tx;label.y=BOARD_H/2;
              dynamicLayer.addChild(label);
            }else if(pt>=0&&pt<24){
              const x=getPointX(pt);
              const top=isTopPoint(pt);
              const dieText=labels.map(l=>l.combo||String(l.die)).join(' ');
              const label=new PIXI.Text({text:dieText,style:{fontSize:9*scale,fill:0xf0c040,fontFamily:'Georgia',fontWeight:'bold'}});
              label.anchor.set(0.5);
              label.x=x;label.y=top?BOARD_H/2-8:BOARD_H/2+8;
              dynamicLayer.addChild(label);
            }
          }
        }

        // Point numbers — only in training mode
        if(training){
          for(let i=0;i<24;i++){
            const x=getPointX(i);
            const top=isTopPoint(i);
            const label=new PIXI.Text({text:String(i+1),style:{fontSize:Math.max(7,COL_W*0.3),fill:COL.midLine,fontFamily:'Georgia'}});
            label.anchor.set(0.5);
            label.x=x;label.y=top?BOARD_H/2-6:BOARD_H/2+6;
            dynamicLayer.addChild(label);
          }
        }
      }

      function drawChecker(container,x,y,r,isPlayer,animate){
        const checker=new PIXI.Graphics();
        // Shadow
        checker.circle(x+1,y+2,r);
        checker.fill({color:0x000000,alpha:0.3});
        // Main body
        checker.circle(x,y,r);
        checker.fill({color:isPlayer?COL.playerChecker:COL.cpuChecker});
        checker.stroke({color:isPlayer?COL.playerBorder:COL.cpuBorder,width:1.5});
        // Inner highlight
        checker.circle(x-r*0.25,y-r*0.25,r*0.4);
        checker.fill({color:isPlayer?COL.playerCheckerLight:COL.cpuCheckerLight,alpha:0.3});
        container.addChild(checker);
      }

      // Animate a checker moving from one point to another
      function animateMove(fromPt,toPt,isPlayer){
        const app=appRef.current;
        if(!app)return;
        const{dynamicLayer}=containersRef.current;
        if(!dynamicLayer)return;
        // Calculate source and dest positions
        function ptPos(pt,player){
          if(pt===-1){
            // Bar
            const bx=boardLeft+6*COL_W+BAR_W/2;
            // Match centered-bar rendering so flying-from-bar starts where the eye sees the checker
            return{x:bx,y:player===0?BOARD_H*3/4:BOARD_H/4};
          }
          if(pt===-2||pt===25){
            // Bear off
            const tx=player===0?BEAR_W+BOARD_W+10+BEAR_W/2:BEAR_W/2;
            return{x:tx,y:BOARD_H/2};
          }
          const x=getPointX(pt);
          const top=isTopPoint(pt);
          // Approximate y at the tip of the stack
          const count=Math.abs(gameState.board[pt])||1;
          const spacing=Math.min(CHECKER_R*1.7,POINT_H/5.5);
          const stackY=top?(10+CHECKER_R+(Math.min(count,5)-1)*spacing):(BOARD_H-10-CHECKER_R-(Math.min(count,5)-1)*spacing);
          return{x,y:stackY};
        }
        const src=ptPos(fromPt,isPlayer?0:1);
        const dst=ptPos(toPt,isPlayer?0:1);
        // Create animated checker
        const anim=new PIXI.Graphics();
        const r=CHECKER_R;
        function drawAt(x,y,lift){
          // lift in [0,1]: 0=resting, 1=peak mid-flight (picked up)
          const sizeScale=1.1+lift*0.10;
          const shadowOff=2+lift*6;
          const shadowAlpha=0.30+lift*0.18;
          const shadowSpread=1+lift*0.15;
          const rr=r*sizeScale;
          anim.clear();
          // Shadow grows and shifts to suggest height
          anim.circle(x+1,y+shadowOff,rr*shadowSpread);anim.fill({color:0x000000,alpha:shadowAlpha});
          anim.circle(x,y,rr);anim.fill({color:isPlayer?COL.playerChecker:COL.cpuChecker});
          anim.stroke({color:isPlayer?COL.playerBorder:COL.cpuBorder,width:1.5});
          anim.circle(x-rr*0.25,y-rr*0.25,rr*0.35);anim.fill({color:isPlayer?COL.playerCheckerLight:COL.cpuCheckerLight,alpha:0.3});
        }
        drawAt(src.x,src.y,0);
        dynamicLayer.addChild(anim);
        // Hide destination checker during animation
        animatingToRef.current=(toPt>=0&&toPt<24)?toPt:null;
        updateDynamic(); // redraw without the top checker at dest
        dynamicLayer.addChild(anim); // re-add anim sprite on top
        const dur=220;const start=performance.now();
        function step(now){
          const t=Math.min(1,(now-start)/dur);
          // Cubic ease-out for smoother arrival
          const ease=1-Math.pow(1-t,3);
          const cx=src.x+(dst.x-src.x)*ease;
          const cy=src.y+(dst.y-src.y)*ease;
          // Lift peaks mid-flight (parabolic), 0 at endpoints
          const lift=Math.sin(t*Math.PI);
          drawAt(cx,cy,lift);
          if(t<1){animRef.current=requestAnimationFrame(step)}
          else{
            dynamicLayer.removeChild(anim);
            animRef.current=null;
            animatingToRef.current=null;
            updateDynamic(); // redraw with all checkers visible
          }
        }
        if(animRef.current)cancelAnimationFrame(animRef.current);
        animRef.current=requestAnimationFrame(step);
      }

      // Trigger move animation when moveId changes
      const prevMoveIdRef=useRef(0);
      useEffect(()=>{
        if(appRef.current)updateDynamic();
        // Check if a new move happened
        const mid=uiState.moveId||0;
        if(mid>prevMoveIdRef.current&&uiState.lastMoveFrom!=null&&uiState.lastMovedTo!=null){
          prevMoveIdRef.current=mid;
          animateMove(uiState.lastMoveFrom,uiState.lastMovedTo,uiState.lastMovePlayer===0);
        }
      });

      // Build DOM click overlay zones on top of the canvas
      const overlayZones=[];
      // Point click zones
      for(let i=0;i<24;i++){
        const x=getPointX(i);
        const top=isTopPoint(i);
        const idx=i;
        overlayZones.push(React.createElement('div',{
          key:'pt'+i,
          onClick:()=>onPointClick(idx),
          style:{
            position:'absolute',
            left:(x-COL_W/2)+'px',
            top:top?'0':BOARD_H/2+'px',
            width:COL_W+'px',
            height:BOARD_H/2+'px',
            cursor:'pointer',
            zIndex:3,
          }
        }));
      }
      // Bar click zone (bottom half for player)
      const barXOverlay=boardLeft+6*COL_W+BAR_W/2;
      overlayZones.push(React.createElement('div',{
        key:'bar',
        onClick:()=>onBarClick(),
        style:{
          position:'absolute',
          left:(barXOverlay-BAR_W/2)+'px',
          top:BOARD_H/2+'px',
          width:BAR_W+'px',
          height:BOARD_H/2+'px',
          cursor:'pointer',
          zIndex:2,
        }
      }));
      // Player bear-off click zone (right tray)
      overlayZones.push(React.createElement('div',{
        key:'bearoff',
        onClick:()=>onBearOffClick(),
        style:{
          position:'absolute',
          left:(BEAR_W+BOARD_W+10)+'px',
          top:'0',
          width:BEAR_W+'px',
          height:BOARD_H+'px',
          cursor:'pointer',
          zIndex:2,
        }
      }));

      return React.createElement('div',{style:{position:'relative',width:TOTAL_W+'px',height:TOTAL_H+'px'}},
        React.createElement('canvas',{
          ref:canvasRef,
          width:TOTAL_W,
          height:TOTAL_H,
          style:{
            width:TOTAL_W+'px',
            height:TOTAL_H+'px',
            borderRadius:'10px',
            touchAction:'none',
            position:'absolute',
            top:0,left:0,
          }
        }),
        ...overlayZones,
      );
    }

    /* ═══════════════════════════════════════════════════════════
       Main App Component
       ═══════════════════════════════════════════════════════════ */
    function App(){
      const[,forceUpdate]=useState(0);
      const tick=useCallback(()=>forceUpdate(n=>n+1),[]);
      const g=useRef({
        phase:P.MENU,
        difficulty:'sharp',
        matchLength:5,
        training:false,
        gameMode:'single',
        state:initState(),
        dice:[],
        diceUsed:[],
        currentPlayer:0,
        selected:null,
        validDests:[],
        turnMoves:[],
        turnStates:[],
        remainingDice:[],
        allLegalMoves:[],
        destLabels:{},
        matchScore:[0,0],
        cubeValue:1,
        cubeOwner:-1,
        crawford:false,
        crawfordUsed:false,
        analysis:null,
        message:'',
        skin:localStorage.getItem('bgSkin')||'ivory',
        history:[],
        animating:false,
        diceAnim:false,
        lastMovedTo:null,
        lastMoveFrom:null,
        lastMovePlayer:0,
        moveId:0,
        fastForward:false,
        useServerAnalysis:localStorage.getItem('bgServerAI')!=='false', /* default ON, can be disabled */
        serverAnalysisAvailable:null, /* null=unknown, true/false=tested */
      }).current;

      const workerRef=useRef(null);
      useEffect(()=>{
        const blob=new Blob([document.getElementById('ai-worker').textContent],{type:'application/javascript'});
        workerRef.current=new Worker(URL.createObjectURL(blob));
        return()=>workerRef.current&&workerRef.current.terminate();
      },[]);

      /* Probe the analysis server on a loop. Doubles as the cold-start warmup
         (the GET wakes an idle Fly machine) AND tracks reachability so the
         menu can gate Master/Training, which are gnubg-only. /health returns
         CORS headers so a normal fetch can read the status. Re-checks every
         10s so it self-heals the moment the connection returns. */
      useEffect(()=>{
        if(!ANALYSIS_SERVER_URL){g.serverReachable=false;tick();return;}
        let cancelled=false;
        function offlineCoerce(){
          /* Don't strand the player in a server-only mode. Only adjust on the
             menu — mid-game has its own pause/retry handling. */
          if(g.phase===P.MENU){
            if(g.difficulty==='master')g.difficulty='sharp';
            if(g.training)g.training=false;
          }
        }
        function check(){
          const ctrl=new AbortController();
          const t=setTimeout(()=>ctrl.abort(),7000);
          fetch(ANALYSIS_SERVER_URL+'/health',{method:'GET',signal:ctrl.signal})
            .then(r=>{clearTimeout(t);if(cancelled)return;
              g.serverReachable=r.ok;if(!r.ok)offlineCoerce();tick();})
            .catch(()=>{clearTimeout(t);if(cancelled)return;
              g.serverReachable=false;offlineCoerce();tick();});
        }
        check();
        const id=setInterval(check,10000);
        return()=>{cancelled=true;clearInterval(id);};
      },[]);

      // Force re-render on resize/orientation change so layout recalculates
      useEffect(()=>{
        const onResize=()=>tick();
        window.addEventListener('resize',onResize);
        window.addEventListener('orientationchange',()=>setTimeout(onResize,100));
        return()=>{window.removeEventListener('resize',onResize)};
      },[]);

      /* ─── AdMob ad unit IDs ───
         These are Google's test IDs — replace with real ones from AdMob console before launch.
         Test IDs always return ads but generate $0 revenue. */
      const ADMOB_BANNER_ID = 'ca-app-pub-3940256099942544/2934735716'; // iOS test banner
      const ADMOB_INTERSTITIAL_ID = 'ca-app-pub-3940256099942544/4411468910'; // iOS test interstitial

      /* ─── Ads & IAP ─── */
      const [adsRemoved, setAdsRemoved] = useState(() => {
        try { return localStorage.getItem('adsRemoved') === 'true'; } catch(e) { return false; }
      });
      const [adMobReady, setAdMobReady] = useState(false);
      const [interstitialLoaded, setInterstitialLoaded] = useState(false);
      const [iapProduct, setIapProduct] = useState(null);
      const [purchaseLoading, setPurchaseLoading] = useState(false);
      const [showPrePrompt, setShowPrePrompt] = useState(false);
      const prePromptResolveRef = useRef(null);
      const [attResolved, setAttResolved] = useState(false);

      // IAP product loading
      useEffect(() => {
        const loadProduct = async () => {
          try {
            if (typeof Capacitor === 'undefined') return;
            const { NativePurchases } = Capacitor.Plugins;
            if (!NativePurchases) return;
            const products = await NativePurchases.getProducts({
              productIdentifiers: ['com.esbrolabs.backgammon.removeads'],
              productType: 'INAPP',
            });
            if (products && products.products && products.products.length > 0) {
              setIapProduct(products.products[0]);
            }
          } catch (err) { console.error('IAP load:', err); }
        };
        loadProduct();
      }, []);

      // ATT prompt
      useEffect(() => {
        const requestATT = async () => {
          try {
            if (typeof Capacitor === 'undefined') { setAttResolved(true); return; }
            const { AdMob } = Capacitor.Plugins;
            if (!AdMob) { setAttResolved(true); return; }
            await AdMob.initialize();
            const trackStatus = await AdMob.trackingAuthorizationStatus();
            if (trackStatus.status === 'notDetermined') {
              await new Promise(resolve => {
                prePromptResolveRef.current = resolve;
                setShowPrePrompt(true);
              });
              await AdMob.requestTrackingAuthorization();
            }
          } catch (err) { console.warn('ATT flow:', err); }
          setAttResolved(true);
        };
        requestATT();
      }, []);

      // AdMob initialization
      useEffect(() => {
        if (adsRemoved || !attResolved) return;
        const initAds = async () => {
          try {
            if (typeof Capacitor === 'undefined') return;
            const { AdMob } = Capacitor.Plugins;
            if (!AdMob) return;
            try {
              const consent = await AdMob.requestConsentInfo();
              if (consent.isConsentFormAvailable && consent.status === 'REQUIRED') await AdMob.showConsentForm();
            } catch (consentErr) { console.warn('Consent flow:', consentErr); }
            setAdMobReady(true);
            await AdMob.prepareInterstitial({ adId: ADMOB_INTERSTITIAL_ID });
            setInterstitialLoaded(true);
          } catch (err) { console.error('Ad init:', err); }
        };
        initAds();
      }, [adsRemoved, attResolved]);

      // Banner ad lifecycle
      useEffect(() => {
        if (adsRemoved || !adMobReady || typeof Capacitor === 'undefined') return;
        const { AdMob } = Capacitor.Plugins;
        if (!AdMob) return;
        AdMob.showBanner({ adId: ADMOB_BANNER_ID, adSize: 'BANNER', position: 'BOTTOM_CENTER', margin: 0 }).catch(() => {});
        return () => { AdMob.hideBanner().catch(() => {}); };
      }, [adsRemoved, adMobReady]);

      const showInterstitialAd = async () => {
        if (adsRemoved || !interstitialLoaded || typeof Capacitor === 'undefined') return;
        // Global 60s cooldown across ALL interstitial triggers. AdMob bans
        // accounts for ads on every action / back-to-back ads; this also
        // prevents the game-over ad and a MENU-tap ad from doubling up.
        // Stored on the persistent g ref so it survives re-renders.
        const now = Date.now();
        if (g.lastInterstitialAt && now - g.lastInterstitialAt < 60000) return;
        g.lastInterstitialAt = now;  // set before await so rapid taps can't race past
        try {
          const { AdMob } = Capacitor.Plugins;
          if (!AdMob) return;
          await AdMob.showInterstitial();
          AdMob.prepareInterstitial({ adId: ADMOB_INTERSTITIAL_ID })
            .then(() => setInterstitialLoaded(true)).catch(() => setInterstitialLoaded(false));
        } catch (err) { console.error('Interstitial:', err); }
      };

      const handleRemoveAds = async () => {
        if (purchaseLoading || !iapProduct) return;
        setPurchaseLoading(true);
        try {
          const { NativePurchases } = Capacitor.Plugins;
          await NativePurchases.purchaseProduct({
            productIdentifier: 'com.esbrolabs.backgammon.removeads',
            productType: 'INAPP',
            quantity: 1,
          });
          localStorage.setItem('adsRemoved', 'true');
          setAdsRemoved(true);
          try { const { AdMob } = Capacitor.Plugins; if (AdMob) await AdMob.removeBanner(); } catch(e) {}
        } catch (err) { console.error('Purchase:', err); }
        finally { setPurchaseLoading(false); }
      };

      const handleRestorePurchases = async () => {
        if (purchaseLoading) return;
        setPurchaseLoading(true);
        try {
          const { NativePurchases } = Capacitor.Plugins;
          const result = await NativePurchases.restorePurchases();
          const txns = result.transactions || [];
          if (txns.some(t => t.productIdentifier === 'com.esbrolabs.backgammon.removeads')) {
            localStorage.setItem('adsRemoved', 'true');
            setAdsRemoved(true);
            try { const { AdMob } = Capacitor.Plugins; if (AdMob) await AdMob.removeBanner(); } catch(e) {}
          }
        } catch (err) { console.error('Restore:', err); }
        finally { setPurchaseLoading(false); }
      };

      // ─── App URLs ───
      // Backgammon's app ID will be assigned by Apple after first submission.
      // Until then, the manual Rate App button will fall back to the in-app StoreKit prompt.
      const APP_STORE_URL = 'https://apps.apple.com/app/id0000000000'; // TODO: update after Apple assigns the ID
      const APP_STORE_REVIEW_URL = 'https://apps.apple.com/app/id0000000000?action=write-review'; // TODO
      // Esbro Labs LLC developer page (confirmed)
      const DEVELOPER_PAGE_URL = 'https://apps.apple.com/developer/esbro-labs-llc/id1883578468';
      const DEVELOPER_FALLBACK_URL = 'itms-apps://apps.apple.com/developer/esbro-labs-llc/id1883578468';

      // Automatic review prompt — triggered after 3rd win (Apple limits to 3x/year anyway)
      const maybeRequestReview = () => {
        try {
          const wins = parseInt(localStorage.getItem('bgGamesWon') || '0', 10) + 1;
          localStorage.setItem('bgGamesWon', String(wins));
          if (wins === 3) {
            setTimeout(() => {
              if (typeof Capacitor !== 'undefined') {
                try { Capacitor.Plugins.App?.requestReview?.(); } catch(e) {}
              }
            }, 2000);
          }
        } catch(e) {}
      };

      // Manual "Rate this app" — opens review URL or triggers in-app review prompt
      const handleRateApp = () => {
        try {
          // First try the native StoreKit prompt (preferred — stays in-app)
          if (typeof Capacitor !== 'undefined' && Capacitor.Plugins.App?.requestReview) {
            Capacitor.Plugins.App.requestReview();
            return;
          }
        } catch(e) {}
        // Fallback: open App Store review page in browser
        try { window.open(APP_STORE_REVIEW_URL, '_blank'); } catch(e) {}
      };

      // Open developer's other apps in App Store
      const handleMoreGames = () => {
        try {
          // Use itms-apps:// for direct App Store link on iOS
          window.open(DEVELOPER_FALLBACK_URL, '_blank');
        } catch(e) {
          try { window.open(DEVELOPER_PAGE_URL, '_blank'); } catch(e) {}
        }
      };

      function safeTimeout(fn,ms){setTimeout(()=>{fn();tick()},ms)}

      /* ─── Dice ─── */
      function rollDice(){return[Math.floor(Math.random()*6)+1,Math.floor(Math.random()*6)+1]}
      function getDiceList(d){return d[0]===d[1]?[d[0],d[0],d[0],d[0]]:[d[0],d[1]]}

      /* ─── Game Flow ─── */
      function startGame(){
        g.state=initState();g.dice=[];g.turnMoves=[];g.turnStates=[];
        g.matchScore=[0,0];g.cubeValue=1;g.cubeOwner=-1;
        g.crawford=false;g.crawfordUsed=false;
        g.history=[];g.analysis=null;g.selected=null;g.message='';
        g.lastMovedTo=null;g.animating=false;
        startNewGame();
      }
      function startNewGame(){
        g.state=initState();g.dice=[];g.turnMoves=[];g.turnStates=[];
        g.cubeOwner=-1;g.cubeValue=1;
        g.selected=null;g.analysis=null;g.message='';g.lastMovedTo=null;
        doOpeningRoll();
      }
      function doOpeningRoll(){
        g.phase=P.ROLLING;g.diceAnim=true;hapticMedium();tick();
        safeTimeout(()=>{
          let d=rollDice();
          while(d[0]===d[1])d=rollDice();
          g.dice=d;g.diceAnim=false;
          sfxRoll();
          if(d[0]>d[1]){
            g.currentPlayer=0;g.message='You won the opening roll!';
            g.remainingDice=getDiceList(d);
            beginPlayerTurn();
          }else{
            g.currentPlayer=1;g.message='CPU won the opening roll.';
            g.remainingDice=getDiceList(d);
            safeTimeout(()=>doCpuTurn(),800);
          }
          tick();
        },1000);
      }
      /* Derive the training recommendation purely from the immutable
         turn-start gnubg plan. NEVER falls back to the local engine — if a
         gnubg answer can't be derived we surface an honest status instead:
           {loading:true}  waiting on the server
           {offline:true}  server unreachable / no connection
           {offPlan:true}  player went off gnubg's line; can't re-analyze a
                            partial roll (gnubg's API expects a fresh roll)
         The training panel renders a clear message for each. */
      function refreshTrainingPanel(){
        if(!g.training)return;
        const tp=g.turnPlan;
        if(!tp||!tp.base||!tp.base.best||!tp.base.best.moves){
          g.analysis={offline:true};return;
        }
        const plan=tp.base.best.moves;
        const played=g.turnMoves;
        const key=m=>m.from+'>'+m.to;
        const planCount={};
        for(const m of plan){const k=key(m);planCount[k]=(planCount[k]||0)+1;}
        let onPlan=plan.length>=played.length;
        const playedCount={};
        if(onPlan){
          for(const m of played){
            const k=key(m);
            playedCount[k]=(playedCount[k]||0)+1;
            if(playedCount[k]>(planCount[k]||0)){onPlan=false;break;}
          }
        }
        if(!onPlan){g.analysis={offPlan:true};return;}
        const remaining=[];
        const taken={};
        for(const m of plan){
          const k=key(m);
          taken[k]=(taken[k]||0)+1;
          if(taken[k]>(playedCount[k]||0))remaining.push(m);
        }
        g.analysis=remaining.length>0
          ?{...tp.base,best:{...tp.base.best,moves:remaining}}
          :null;
      }

      function beginPlayerTurn(){
        g.phase=P.MOVING;g.turnMoves=[];g.turnStates=[cloneState(g.state)];
        g.turnPlan=null; /* immutable snapshot of the turn-start recommended play */
        g.allLegalMoves=generateMoves(g.state,g.remainingDice,0);

        // Resolve "no legal moves" FIRST — before any server call. Otherwise
        // gnubg legitimately returns no plays for a stuck position (e.g. a
        // checker on the bar that can't enter), analyzeMovesServer returns
        // null, and the async handler below misreads that as "server
        // offline", overwriting the correct "turn passes" message.
        const hasRealMoves=g.allLegalMoves.some(m=>m.moves.length>0);
        if(!hasRealMoves){
          g.message='No legal moves — turn passes.';
          g.analysis=null;
          g.phase=P.MOVING;tick();
          safeTimeout(()=>endTurn(),1200);
          return;
        }
        // Filter out empty-move results
        g.allLegalMoves=g.allLegalMoves.filter(m=>m.moves.length>0);

        if(g.training){
          /* Training is gnubg-only. No local fallback: a weaker engine
             masquerading as expert advice is worse than no advice. Show
             "Analyzing…" while the server responds, then either the EXPERT
             result or an honest "needs internet" message. */
          g.turnPlan=null;
          if(ANALYSIS_SERVER_URL){
            g.analysis={loading:true};
            const snapState=g.state;const snapDice=g.remainingDice.slice();
            analyzeMovesServer(snapState,snapDice,0).then(serverResult=>{
              if(g.state===snapState&&g.training){
                if(serverResult&&serverResult.best){
                  g.analysis=serverResult;
                  g.turnPlan={base:serverResult,moves:serverResult.best.moves.slice()};
                }else{
                  g.analysis={offline:true};g.turnPlan=null;
                }
              }
              tick();
            }).catch(()=>{
              if(g.state===snapState&&g.training){g.analysis={offline:true};g.turnPlan=null;}
              tick();
            });
          }else{
            g.analysis={offline:true};
          }
        }
        g.selected=null;g.message='Your turn — select a checker to move.';tick();
      }

      function animateSequence(moves,idx,cb){
        if(idx>=moves.length){cb();return}
        const mv=moves[idx];
        g.lastMovedTo=mv.to;g.lastMoveFrom=mv.from;g.lastMovePlayer=g.currentPlayer;g.moveId++;g.animating=true;tick();
        if(mv.to>=0&&mv.to<24){
          const wasHit=(g.currentPlayer===0&&g.state.board[mv.to]===-1)||(g.currentPlayer===1&&g.state.board[mv.to]===1);
          if(wasHit){sfxHit();hapticHeavy()}else{sfxPlace();hapticLight()}
        }else{sfxBearOff();hapticMedium()}
        g.state=applyMove(g.state,mv.from,mv.to,g.currentPlayer);
        safeTimeout(()=>{g.animating=false;animateSequence(moves,idx+1,cb)},260);
      }

      /* ─── Player Interaction ─── */
      function handlePointClick(pt){
        if(g.phase!==P.MOVING||g.currentPlayer!==0||g.animating)return;
        if(g.selected!==null){
          const dest=pt;
          if(g.validDests.includes(dest)){executePlayerMove(g.selected,dest);return}
          if(g.selected===pt){g.selected=null;g.validDests=[];g.destLabels={};tick();return}
        }
        if(g.state.board[pt]>0){selectChecker(pt)}
        else{g.selected=null;g.validDests=[];g.destLabels={};tick()}
      }
      function handleBarClick(){
        if(g.phase!==P.MOVING||g.currentPlayer!==0||g.animating)return;
        if(g.state.bar[0]>0)selectChecker(-1);
      }
      function handleBearOffClick(){
        if(g.phase!==P.MOVING||g.currentPlayer!==0||g.animating)return;
        if(g.selected!==null&&g.validDests.includes(-2)){executePlayerMove(g.selected,-2)}
      }
      function selectChecker(pt){
        g.selected=pt;
        // Bar rule: while ANY checker is on the bar, the only legal source
        // is the bar. You must enter every barred checker before moving
        // anything else (including a checker you just entered this turn).
        if(g.state.bar[0]>0&&pt!==-1){
          g.selected=null;g.validDests=[];g.destLabels={};
          g.message='Enter from the bar first.';tick();return;
        }
        const destsMap={};
        function addDest(dest,info){
          const k=dest;
          if(!destsMap[k])destsMap[k]=[];
          const label=info.combo||String(info.die);
          if(!destsMap[k].some(d=>(d.combo||String(d.die))===label))destsMap[k].push(info);
        }
        for(const die of [...new Set(g.remainingDice)]){
          let target;
          if(pt===-1){target=24-die}else{target=pt-die}
          if(target>=0&&target<24&&canLand(g.state.board,target,0)){
            addDest(target,{die,combo:null,mid:null});
          }else if(target<0&&allInHome(g.state,0)){
            if(target===-1||pt>=highestOccupied(g.state,0)){
              addDest(-2,{die,combo:null,mid:null});
            }
          }
        }
        if(g.remainingDice.length>=2){
          const uniqueDice=[...new Set(g.remainingDice)];
          for(const die1 of uniqueDice){
            let mid;
            if(pt===-1){mid=24-die1}else{mid=pt-die1}
            if(mid>=0&&mid<24&&canLand(g.state.board,mid,0)){
              const tempState=applyMove(g.state,pt===-1?-1:pt,mid,0);
              // Entering from the bar with die1: only allow running on with
              // die2 if the bar is now CLEAR. With 2+ on the bar, die2 must
              // enter the next checker, not move the one just entered.
              if(pt===-1&&tempState.bar[0]>0)continue;
              const remainAfter=[...g.remainingDice];
              remainAfter.splice(remainAfter.indexOf(die1),1);
              for(const die2 of [...new Set(remainAfter)]){
                let target2=mid-die2;
                if(target2>=0&&target2<24&&canLand(tempState.board,target2,0)){
                  addDest(target2,{die:null,combo:die1+'+'+die2,mid,dies:[die1,die2]});
                }else if(target2<0&&allInHome(tempState,0)){
                  if(target2===-1||mid>=highestOccupied(tempState,0)){
                    addDest(-2,{die:null,combo:die1+'+'+die2,mid,dies:[die1,die2]});
                  }
                }
              }
            }
          }
        }
        g.validDests=Object.keys(destsMap).map(Number);
        g.destLabels=destsMap;
        if(g.validDests.length===0){g.message='No moves for this checker.';g.selected=null;g.destLabels={}}
        else{g.message='Select destination.'}
        tick();
      }
      function executePlayerMove(from,to){
        const labels=g.destLabels&&g.destLabels[to]?g.destLabels[to]:[];
        const dist=from===-1?24-to:from-to;
        let singleMove=labels.find(l=>!l.combo&&g.remainingDice.includes(l.die));
        if(!singleMove&&to===-2){
          const exact=from+1;
          singleMove=labels.find(l=>!l.combo);
          if(singleMove){
            if(g.remainingDice.includes(exact)){singleMove={die:exact,combo:null,mid:null}}
            else{
              const sorted=[...g.remainingDice].sort((a,b)=>a-b);
              for(const d of sorted){if(d>=exact){singleMove={die:d,combo:null,mid:null};break}}
            }
          }
        }
        if(singleMove&&!singleMove.combo){
          const usedDie=singleMove.die;
          if(!g.remainingDice.includes(usedDie)){
            g.message='Invalid move.';g.selected=null;g.validDests=[];g.destLabels={};tick();return;
          }
          g.turnStates.push(cloneState(g.state));
          const wasHit=(to>=0&&to<24&&g.state.board[to]===-1);
          g.state=applyMove(g.state,from,to,0);
          g.lastMovedTo=to;g.lastMoveFrom=from;g.lastMovePlayer=0;g.moveId++;
          g.remainingDice.splice(g.remainingDice.indexOf(usedDie),1);
          g.turnMoves.push({from,to,die:usedDie});
          if(wasHit){sfxHit();hapticHeavy()}else if(to===-2){sfxBearOff();hapticMedium()}else{sfxPlace();hapticLight()}
          g.selected=null;g.validDests=[];g.destLabels={};
          afterPlayerMove();
          return;
        }
        const comboMove=labels.find(l=>l.combo);
        if(comboMove&&comboMove.dies&&comboMove.mid!=null){
          const die1=comboMove.dies[0];const die2=comboMove.dies[1];
          const mid=comboMove.mid;
          g.turnStates.push(cloneState(g.state));
          const wasHit1=(mid>=0&&mid<24&&g.state.board[mid]===-1);
          g.state=applyMove(g.state,from,mid,0);
          g.lastMovedTo=mid;g.lastMoveFrom=from;g.lastMovePlayer=0;g.moveId++;
          g.remainingDice.splice(g.remainingDice.indexOf(die1),1);
          g.turnMoves.push({from,to:mid,die:die1});
          if(wasHit1){sfxHit();hapticHeavy()}else{sfxPlace();hapticLight()}
          g.animating=true;tick();
          safeTimeout(()=>{
            g.turnStates.push(cloneState(g.state));
            const wasHit2=(to>=0&&to<24&&g.state.board[to]===-1);
            g.state=applyMove(g.state,mid,to,0);
            g.lastMovedTo=to;g.lastMoveFrom=mid;g.lastMovePlayer=0;g.moveId++;
            g.remainingDice.splice(g.remainingDice.indexOf(die2),1);
            g.turnMoves.push({from:mid,to,die:die2});
            if(wasHit2){sfxHit();hapticHeavy()}else if(to===-2){sfxBearOff();hapticMedium()}else{sfxPlace();hapticLight()}
            g.animating=false;
            g.selected=null;g.validDests=[];g.destLabels={};
            afterPlayerMove();
          },260);
          return;
        }
        const usedDie=dist;
        if(g.remainingDice.includes(usedDie)){
          g.turnStates.push(cloneState(g.state));
          const wasHit=(to>=0&&to<24&&g.state.board[to]===-1);
          g.state=applyMove(g.state,from,to,0);
          g.lastMovedTo=to;g.lastMoveFrom=from;g.lastMovePlayer=0;g.moveId++;
          g.remainingDice.splice(g.remainingDice.indexOf(usedDie),1);
          g.turnMoves.push({from,to,die:usedDie});
          if(wasHit){sfxHit();hapticHeavy()}else if(to===-2){sfxBearOff();hapticMedium()}else{sfxPlace();hapticLight()}
          g.selected=null;g.validDests=[];g.destLabels={};
          afterPlayerMove();
          return;
        }
        g.message='Invalid move.';g.selected=null;g.validDests=[];g.destLabels={};tick();
      }
      function afterPlayerMove(){
        if(g.remainingDice.length>0){
          g.allLegalMoves=generateMoves(g.state,g.remainingDice,0);
          if(g.training){
            /* Re-derive from the immutable turn-start gnubg plan. Never local:
               if on-plan, shows the remaining gnubg moves; if the player went
               off the recommended line, shows an honest "off line" message
               rather than a weaker local pick. */
            refreshTrainingPanel();
          }
          const hasMore=g.allLegalMoves.some(m=>m.moves.length>0);
          if(!hasMore){
            g.message='No more legal moves.';
            g.analysis=null;
            addHistory(0,g.dice,g.turnMoves);
            tick();
            safeTimeout(()=>endTurn(),800);
            return;
          }
          g.allLegalMoves=g.allLegalMoves.filter(m=>m.moves.length>0);
          g.message='Continue moving.';tick();
        }else{
          addHistory(0,g.dice,g.turnMoves);
          endTurn();
        }
      }
      function undoLastMove(){
        if(g.turnMoves.length===0||g.phase!==P.MOVING)return;
        const lastMove=g.turnMoves.pop();
        g.remainingDice.push(lastMove.die);
        g.state=g.turnStates.pop();
        g.selected=null;g.validDests=[];g.destLabels={};
        g.allLegalMoves=generateMoves(g.state,g.remainingDice,0);
        if(g.training){

             re-derive from it (no local engine). */
          refreshTrainingPanel();
        }
        g.message='Move undone.';tick();
      }

      function endTurn(){
        if(g.state.off[g.currentPlayer]>=15){handleWin(g.currentPlayer);return}
        g.currentPlayer=1-g.currentPlayer;
        g.selected=null;g.validDests=[];g.destLabels={};g.turnMoves=[];g.analysis=null;
        if(g.currentPlayer===1){
          if(g.gameMode==='match'&&shouldDouble(g.state,1,g.matchScore,g.matchLength,g.cubeValue,g.cubeOwner,g.crawford)){
              g.phase=P.DOUBLING;g.message='CPU offers to double!';sfxDouble();tick();
              return;
          }
          g.phase=P.CPU_ROLLING;g.message='CPU rolling...';g.diceAnim=true;hapticMedium();tick();
          safeTimeout(()=>{
            g.dice=rollDice();g.diceAnim=false;g.remainingDice=getDiceList(g.dice);
            sfxRoll();g.message='CPU thinking...';tick();
            safeTimeout(()=>doCpuTurn(),600);
          },1000);
        }else{
          g.phase=P.ROLLING;g.message='Your turn — click Roll.';tick();
        }

      function handlePlayerRoll(){
        if(g.phase!==P.ROLLING||g.currentPlayer!==0)return;
        g.diceAnim=true;hapticMedium();tick();
        safeTimeout(()=>{
          g.dice=rollDice();g.diceAnim=false;g.remainingDice=getDiceList(g.dice);
          sfxRoll();beginPlayerTurn();
        },1000);
      }
      /* Fast-forward: instantly resolve a race position by simulating roll+best-move for both players */
      function handleFastForward(){
        if(hasContactMT(g.state))return; /* still contact, can't FF */
        if(g.state.bar[0]>0||g.state.bar[1]>0)return;
        g.fastForward=true;
        g.message='Fast forwarding race...';
        tick();
        function ffStep(){
          /* Check for win */
          if(g.state.off[0]>=15){g.fastForward=false;handleWin(0);tick();return}
          if(g.state.off[1]>=15){g.fastForward=false;handleWin(1);tick();return}
          /* Roll for current player */
          const dice=rollDice();
          g.dice=dice;
          g.remainingDice=getDiceList(dice);
          /* Generate best move for race (use evaluateRaceMT for speed) */
          const moves=generateMoves(g.state,g.remainingDice,g.currentPlayer);
          if(moves.length===0){
            /* No moves - skip turn */
            g.currentPlayer=1-g.currentPlayer;
            tick();setTimeout(ffStep,30);return;
          }
          /* Pick best move by evaluation */
          let best=moves[0];let bestScore=-Infinity;
          for(const m of moves){
            const sc=evaluateRaceMT(m.state,g.currentPlayer);
            if(sc>bestScore){bestScore=sc;best=m}
          }
          g.state=best.state;
          g.lastMovedTo=null;g.lastMoveFrom=null;
          /* Quick visual update */
          tick();
          /* Check for win after move */
          if(g.state.off[0]>=15||g.state.off[1]>=15){
            setTimeout(ffStep,30);return;
          }
          /* Switch turn */
          g.currentPlayer=1-g.currentPlayer;
          setTimeout(ffStep,30);
        }
        ffStep();
      }
      function handlePlayerDouble(){
        if(g.gameMode!=='match'||g.crawford)return;
        if(g.cubeValue>=g.matchLength)return; /* cube already covers the match */
        g.phase=P.DOUBLING;g.message='You offer to double!';sfxDouble();tick();
        safeTimeout(()=>{
          const accept=shouldTake(g.state,1,g.cubeValue*2);
          if(accept){
            g.cubeValue*=2;g.cubeOwner=1;
            g.message='CPU accepts the double. Cube at '+g.cubeValue+'.';

          }else{

      function handleDoubleResponse(accept){

      function doCpuTurn(){
        g.phase=P.CPU_TURN;
        const worker=workerRef.current;
        if(!worker){endTurn();return}

        // Animate a sequence of CPU moves (shared by server and worker paths)
        function playMoves(moves,finalState){
          if(!moves||moves.length===0){
            g.message='CPU has no legal moves.';tick();
            safeTimeout(()=>endTurn(),800);
            return;
          }
          let i=0;
          function nextCpuMove(){
            if(i>=moves.length){
              g.state=finalState;
              addHistory(1,g.dice,moves);
              g.animating=false;
              tick();
              safeTimeout(()=>endTurn(),300);
              return;
            }
            const mv=moves[i];
            g.lastMovedTo=mv.to;g.lastMoveFrom=mv.from;g.lastMovePlayer=1;g.moveId++;
            const wasHit=(mv.to>=0&&mv.to<24&&(g.state.board[mv.to]===1));
            g.state=applyMove(g.state,mv.from,mv.to,1);
            if(wasHit){sfxHit();hapticHeavy()}else if(mv.to===25||mv.to===-2){sfxBearOff();hapticMedium()}else{sfxPlace();hapticLight()}
            i++;tick();
            safeTimeout(nextCpuMove,260);
          }
          nextCpuMove();
        }

        function runLocalWorker(){
          worker.onmessage=(e)=>{
            const{moves,state:finalState}=e.data;
            playMoves(moves,finalState);
          };
          worker.postMessage({state:g.state,dice:g.remainingDice,player:1,difficulty:g.difficulty});
        }

        // Master difficulty is gnubg-only — never silently downgrade the
        // opponent to the weak local engine. If the server is unreachable,
        // pause with a clear message and auto-retry; the game resumes the
        // moment the connection returns.
        if(g.difficulty==='master'&&ANALYSIS_SERVER_URL){
          let attempt=0;
          const tryServer=()=>{
            g.message=attempt===0?'CPU thinking…':'Waiting for connection — Master needs internet…';
            tick();

              if(result&&result.best&&result.best.moves){
                g.message='';
                playMoves(result.best.moves,result.best.state);
              }else{
                attempt++;
                safeTimeout(tryServer,4000);
              }
            }).catch(()=>{
              attempt++;
              safeTimeout(tryServer,4000);
            });
          };
          tryServer();
          return;
        }

        runLocalWorker();
      }

      function handleWin(player){
        const opp=1-player;
        let mult=1;let winType='single';
        if(g.state.off[opp]===0){
          mult=2;winType='gammon';
          if(player===0&&(g.state.bar[1]>0||(()=>{for(let i=0;i<6;i++)if(g.state.board[i]<0)return true;return false})())){
            mult=3;winType='backgammon';

      /* ─── Die Component ─── */

                g.serverReachable===false?React.createElement('div',{style:{
                  fontSize:'10px',color:'#c0392b',marginTop:'6px',
                }},'No internet — Master & Training need a connection'):null,
              ),
              // Game Mode
              React.createElement('div',{style:{marginBottom:'14px'}},
                React.createElement('div',{style:{fontSize:'10px',color:sk.uiTextDim,letterSpacing:'2px',marginBottom:'8px'}},'GAME MODE'),
                React.createElement('div',{style:{display:'flex',gap:'6px',justifyContent:'center'}},
                  ['single','match'].map(m=>
                    React.createElement('button',{key:m,onClick:()=>{g.gameMode=m;tick()},style:S.btn(g.gameMode===m)},
                      m==='single'?'Single Game':'Match Play')
                  )
                ),
              ),
              // Match Length
              g.gameMode==='match'?React.createElement('div',{style:{marginBottom:'14px'}},
                React.createElement('div',{style:{fontSize:'10px',color:sk.uiTextDim,letterSpacing:'2px',marginBottom:'8px'}},'MATCH LENGTH'),
                React.createElement('div',{style:{display:'flex',gap:'6px',justifyContent:'center'}},
                  [1,3,5,7,11].map(n=>
                    React.createElement('button',{key:n,onClick:()=>{g.matchLength=n;tick()},style:{
                      ...S.btn(g.matchLength===n),fontSize:'13px',padding:'6px 12px',
                    }},n+' pt'+(n>1?'s':''))
                  )
                ),
              ):null,
              // Training
              React.createElement('div',{style:{marginBottom:'14px'}},
                (function(){const tLocked=g.serverReachable===false;
                return React.createElement('button',{onClick:()=>{if(tLocked)return;g.training=!g.training;tick()},style:{
                  ...S.btn(g.training),
                  background:g.training?'linear-gradient(135deg,#2a6a3a,#3a8a4a)':sk.uiBtnPassive,
                  color:g.training?'#e8d5a3':sk.uiTextDim,
                  opacity:tLocked?0.4:1,cursor:tLocked?'not-allowed':'pointer',
                }},'Training Mode')})(),
              ),
              // Skin selector
              React.createElement('div',{style:{marginBottom:'14px'}},
                React.createElement('div',{style:{fontSize:'10px',color:sk.uiTextDim,letterSpacing:'2px',marginBottom:'8px'}},'BOARD THEME'),
                React.createElement('div',{style:{display:'flex',gap:'10px',justifyContent:'center'}},
                  SKIN_KEYS.map(k=>{
                    const s=SKINS[k];const active=g.skin===k;
                    return React.createElement('div',{key:k,onClick:()=>{g.skin=k;localStorage.setItem('bgSkin',k);tick()},
                      style:{
                        width:'40px',height:'40px',borderRadius:'50%',cursor:'pointer',
                        background:s.swatch,
                        border:active?'3px solid '+sk.uiAccent:'2px solid rgba(255,255,255,0.15)',
                        boxShadow:active?'0 0 10px '+sk.uiAccent+'66':'none',
                        transition:'all 0.15s',
                      },
                      title:s.name,
                    });
                  })
                ),
                React.createElement('div',{style:{fontSize:'9px',color:sk.uiTextDim,marginTop:'6px'}},SKINS[g.skin].name),
              ),
              // Remove Ads / Restore
              !adsRemoved&&iapProduct?React.createElement('div',{style:{marginBottom:'8px'}},
                React.createElement('button',{onClick:handleRemoveAds,disabled:purchaseLoading,style:{
                  ...S.btn(false),fontSize:'10px',opacity:purchaseLoading?0.5:1,
                }},purchaseLoading?'Processing...':'Remove Ads ('+iapProduct.priceString+')'),
              ):null,
              !adsRemoved?React.createElement('div',{style:{marginBottom:'8px'}},
                React.createElement('button',{onClick:handleRestorePurchases,disabled:purchaseLoading,style:{
                  ...S.btn(false),fontSize:'9px',opacity:purchaseLoading?0.5:1,color:sk.uiTextDim,
                }},purchaseLoading?'...':'Restore Purchases'),
              ):null,
              adsRemoved?React.createElement('div',{style:{fontSize:'11px',color:'#3a8a4a',marginBottom:'8px'}},'Ads Removed'):null,
              // Rate app + More games row
              React.createElement('div',{style:{display:'flex',gap:'10px',justifyContent:'center',marginBottom:'10px',flexWrap:'wrap'}},
                React.createElement('button',{onClick:handleRateApp,style:{
                  ...S.btn(false),fontSize:'10px',padding:'5px 10px',color:sk.uiAccent,
                }},'Rate App'),
                React.createElement('button',{onClick:handleMoreGames,style:{
                  ...S.btn(false),fontSize:'10px',padding:'5px 10px',color:sk.uiAccent,
                }},'More Games'),
              ),
              // Play
              React.createElement('button',{onClick:startGame,style:{
                ...S.btn(true),fontSize:'18px',padding:'12px 50px',marginTop:'6px',
              }},'PLAY'),
          ),
        );
      }

      // GAME SCREEN
      const uiState={selected:g.selected,validDests:g.validDests,lastMovedTo:g.lastMovedTo,destLabels:g.destLabels,lastMoveFrom:g.lastMoveFrom,lastMovePlayer:g.lastMovePlayer,moveId:g.moveId,remainingDice:g.remainingDice,phase:g.phase,currentPlayer:g.currentPlayer};

      // Training panel — compact, fits within container
      const trainingRichPanel=g.training&&g.analysis&&g.analysis.best?React.createElement('div',{style:{
        ...S.panel,width:'100%',maxWidth:'500px',marginTop:'2px',padding:'8px 10px',
      }},
        // Header + confidence + win rate
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px',gap:'4px',flexWrap:'wrap'}},
          React.createElement('div',{style:{fontSize:'9px',color:sk.uiAccent,letterSpacing:'2px'}},
            'STRATEGY',
            g.analysis.usedServer?React.createElement('span',{style:{marginLeft:'6px',fontSize:'8px',color:'#3498db',fontWeight:'bold'}},'EXPERT'):
              g.analysis.usedRollouts?React.createElement('span',{style:{marginLeft:'6px',fontSize:'8px',color:sk.uiTextDim}},'('+g.analysis.totalRollouts+' rollouts)'):null,
          ),
          React.createElement('div',{style:{display:'flex',gap:'4px',alignItems:'center'}},
            g.analysis.usedServer&&g.analysis.best.winRate!=null?React.createElement('div',{style:{
              fontSize:'10px',fontWeight:'bold',color:'#3498db',
              background:'rgba(52,152,219,0.15)',padding:'1px 6px',borderRadius:'8px',
            }},Math.round(g.analysis.best.winRate*100)+'% win'):
              g.analysis.usedRollouts&&g.analysis.best.winRate!=null?React.createElement('div',{style:{
                fontSize:'10px',fontWeight:'bold',color:'#2ecc71',
                background:'rgba(46,204,113,0.15)',padding:'1px 6px',borderRadius:'8px',
              }},Math.round(g.analysis.best.winRate*100)+'% win'):null,
            g.analysis.confidence?React.createElement('div',{style:{
              fontSize:'8px',fontWeight:'bold',color:g.analysis.confidence.color,
              background:'rgba(0,0,0,0.3)',padding:'1px 6px',borderRadius:'8px',
            }},g.analysis.confidence.label):null,
          ),
        ),
        // Strategy explanation — first line only to save space
        React.createElement('div',{style:{fontSize:'11px',color:sk.uiText,marginBottom:'4px',lineHeight:'1.3'}},
          getStrategyExplanation(g.analysis,g.state,0)[0]||''
        ),
        // Tags + best move on one line
        React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:'3px',alignItems:'center'}},
          g.analysis.best.tags.map((t,i)=>React.createElement('span',{key:i,style:{
            fontSize:'8px',fontWeight:'bold',color:t.color,background:t.bg,
            padding:'1px 5px',borderRadius:'3px',letterSpacing:'1px',
          }},t.label)),
          (function(){
            const moves=g.analysis.best.moves;
            if(!moves||moves.length===0)return null;
            const fmt=m=>{
              const from=m.from===-1?'BAR':(m.from+1);
              const to=m.to===-2?'OFF':(m.to+1);
              return from+'\u2192'+to;
            };
            const firstMove=fmt(moves[0]);
            const restMoves=moves.slice(1).map(fmt).join(', ');
            return React.createElement('span',{style:{fontSize:'9px',color:sk.uiTextDim,marginLeft:'4px'}},
              React.createElement('span',{style:{color:sk.uiAccent,fontWeight:'bold'}},'Now: '+firstMove),
              moves.length>1?React.createElement('span',{style:{opacity:0.6}},'  then: '+restMoves):null,
            );
          })(),
        ),
      ):null;

      // Status panel for the non-recommendation training states. Training is
      // gnubg-only — these messages are honest about why there's no advice
      // rather than silently substituting a weaker engine.
      const trainingStatus=g.training&&g.analysis&&!g.analysis.best?(
        g.analysis.loading?{txt:'Analyzing…',col:sk.uiAccent}:
        g.analysis.offline?{txt:'Training analysis needs an internet connection.',col:'#c0392b'}:
        g.analysis.offPlan?{txt:'Off the recommended line — full analysis resumes next roll.',col:sk.uiTextDim}:
        null
      ):null;
      const trainingStatusPanel=trainingStatus?React.createElement('div',{style:{
        ...S.panel,width:'100%',maxWidth:'500px',marginTop:'2px',padding:'8px 10px',
      }},
        React.createElement('div',{style:{fontSize:'9px',color:sk.uiAccent,letterSpacing:'2px',marginBottom:'3px'}},'STRATEGY'),
        React.createElement('div',{style:{fontSize:'12px',color:trainingStatus.col}},trainingStatus.txt),
      ):null;

      const trainingPanel=trainingRichPanel||trainingStatusPanel;

      // ─── Controls block (reused in both layouts) ───
      const diceBlock=React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',padding:isLand?'6px 0':'4px 0',flexShrink:0}},
        g.dice.length>0||g.diceAnim?React.createElement('div',{style:{display:'flex',gap:'5px'}},
          React.createElement(Die,{value:g.dice[0],rolling:g.diceAnim}),
          React.createElement(Die,{value:g.dice[1],rolling:g.diceAnim}),
        ):null,
        g.remainingDice.length>0&&g.phase===P.MOVING?React.createElement('div',{style:{fontSize:'13px',color:sk.uiTextDim}},
          'Remaining: ',g.remainingDice.join(', ')
        ):null,
      );
      /* Show fast-forward when in pure race (no contact, no bar) */
      const canFastForward=(g.phase===P.ROLLING||g.phase===P.MOVING||g.phase===P.CPU_TURN||g.phase===P.CPU_ROLLING)&&
        !hasContactMT(g.state)&&g.state.bar[0]===0&&g.state.bar[1]===0&&!g.fastForward;
      const buttonsBlock=React.createElement('div',{style:{display:'flex',gap:'8px',padding:'2px 0',flexWrap:'wrap',justifyContent:'center',flexShrink:0}},
        g.phase===P.ROLLING&&g.currentPlayer===0&&!g.diceAnim?
          React.createElement('button',{onClick:handlePlayerRoll,style:S.btn(true)},'ROLL'):null,
        g.phase===P.ROLLING&&g.currentPlayer===0&&!g.diceAnim&&g.gameMode==='match'&&!g.crawford&&g.cubeValue<g.matchLength&&(g.cubeOwner===-1||g.cubeOwner===0)?
          React.createElement('button',{onClick:handlePlayerDouble,style:{
            ...S.btn(false),
            color:sk.uiAccentBright,
            border:'1.5px solid '+sk.uiAccentBright,
            fontWeight:'bold',
          }},'DOUBLE'):null,
        canFastForward?
          React.createElement('button',{onClick:handleFastForward,style:{...S.btn(false),color:sk.uiAccent,fontSize:'12px'}},'⏩ FAST FWD'):null,
        g.phase===P.MOVING&&g.turnMoves.length>0?
          React.createElement('button',{onClick:undoLastMove,style:{...S.btn(false),fontSize:'12px'}},'UNDO'):null,
        g.phase===P.MOVING&&g.remainingDice.length===0?
          React.createElement('button',{onClick:()=>endTurn(),style:S.btn(true)},'CONFIRM'):null,
        /* ACCEPT/DECLINE buttons appear when CPU offers a double (currentPlayer is CPU=1 because their turn was just starting when they offered) */
        g.phase===P.DOUBLING&&g.currentPlayer===1?React.createElement(React.Fragment,null,
          React.createElement('button',{onClick:()=>handleDoubleResponse(true),style:S.btn(true)},'ACCEPT'),
          React.createElement('button',{onClick:()=>handleDoubleResponse(false),style:{...S.btn(false),color:'#c0392b'}},'DECLINE'),
        ):null,
        g.phase===P.BETWEEN_GAMES?
          React.createElement('button',{onClick:()=>{startNewGame();tick()},style:S.btn(true)},'NEXT GAME'):null,
        g.phase===P.GAME_OVER?React.createElement(React.Fragment,null,
          React.createElement('button',{onClick:startGame,style:S.btn(true)},'NEW MATCH'),
          React.createElement('button',{onClick:()=>{showInterstitialAd();g.phase=P.MENU;g.analysis=null;tick()},style:S.btn(false)},'MENU'),
        ):null,
      );
      const msgBlock=React.createElement('div',{style:{
        padding:'2px 0',fontSize:'14px',color:g.phase===P.GAME_OVER?sk.uiAccent:sk.uiText,
        textAlign:'center',flexShrink:0,
        animation:g.phase===P.GAME_OVER?'celebratePulse 2s infinite':'none',
      }},g.message);
      const scoreBlock=React.createElement('div',{style:{
        display:'flex',gap:'10px',alignItems:'center',padding:'0 10px 2px',fontSize:'13px',flexWrap:'wrap',justifyContent:'center',flexShrink:0,
      }},
        g.gameMode==='match'?React.createElement(React.Fragment,null,
          React.createElement('span',{style:{color:sk.uiAccent}},'You: ',React.createElement('b',null,g.matchScore[0])),
          React.createElement('span',{style:{color:sk.uiTextDim}},'/',g.matchLength),
          React.createElement('span',{style:{color:sk.uiTextDim}},'CPU: ',React.createElement('b',null,g.matchScore[1])),
          React.createElement(DoublingCube),
          g.crawford?React.createElement('span',{style:{fontSize:'10px',color:'#e67e22'}},'CRAWFORD'):'',
        ):null,
        g.training?React.createElement('span',{style:{fontSize:'11px',color:sk.uiTextDim}},'You: '+pipCount(g.state,0)+'pip'):null,
        g.training?React.createElement('span',{style:{fontSize:'11px',color:sk.uiTextDim}},'CPU: '+pipCount(g.state,1)+'pip'):null,
      );
      // key forces full remount when viewport changes (orientation)
      const boardKey='board-'+window.innerWidth+'-'+window.innerHeight;
      const boardEl=React.createElement(BoardCanvas,{
        key:boardKey,
        gameState:g.state,uiState,
        onPointClick:handlePointClick,onBarClick:handleBarClick,onBearOffClick:handleBearOffClick,
        scale,training:g.training,analysis:g.analysis,skin:g.skin,
      });

      // ─── LANDSCAPE LAYOUT: header top, board left, controls right ───
      if(isLand){
        return React.createElement('div',{style:{...S.bg,overflow:'hidden',position:'relative'}},
          // Header row
          React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',padding:'4px 10px 2px',flexShrink:0}},
            React.createElement('div',{style:{fontSize:'15px',fontWeight:'bold',color:sk.uiAccent}},
              'BACKGAMMON',
              g.training?React.createElement('span',{style:{fontSize:'9px',color:'#3a8a4a',marginLeft:'8px'}},'TRAINING'):'',
            ),
            scoreBlock,
            React.createElement('button',{onClick:()=>{showInterstitialAd();g.phase=P.MENU;g.analysis=null;tick()},style:{
              ...S.btn(false),fontSize:'10px',padding:'3px 8px',
            }},'MENU'),
          ),
          // Main area: board left, controls right
          React.createElement('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',minHeight:0,overflow:'hidden',padding:'0 6px'}},
            boardEl,
            // Right side controls — flex column, scrollable if training is on
            React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'4px',width:'220px',flexShrink:0,maxHeight:'100%',overflowY:'auto',padding:'0 4px'}},
              diceBlock,
              buttonsBlock,
              msgBlock,
              trainingPanel,
            ),
          ),
        );
      }

      // ─── PORTRAIT LAYOUT: everything stacked vertically ───
      return React.createElement('div',{style:{...S.bg,overflow:'hidden',position:'relative'}},
        // Header — pinned to top
        React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',padding:'6px 10px 4px',flexShrink:0}},
          React.createElement('div',{style:{fontSize:'15px',fontWeight:'bold',color:sk.uiAccent}},
            'BACKGAMMON',
            g.training?React.createElement('span',{style:{fontSize:'9px',color:'#3a8a4a',marginLeft:'8px'}},'TRAINING'):'',
          ),
          React.createElement('button',{onClick:()=>{showInterstitialAd();g.phase=P.MENU;g.analysis=null;tick()},style:{
            ...S.btn(false),fontSize:'10px',padding:'3px 8px',
          }},'MENU'),
        ),
        scoreBlock,
        // Board
        boardEl,
        // Controls below board
        diceBlock,
        buttonsBlock,
        msgBlock,
        // Training panel — compact, no extra wrapper needed
        trainingPanel?React.createElement('div',{style:{flexShrink:0,width:'100%',padding:'0 8px'}},trainingPanel):null,
        // Spacer pushes ad to bottom
        React.createElement('div',{style:{flex:1}}),
        // Ad banner spacer
        !adsRemoved?React.createElement('div',{style:{height:'60px',flexShrink:0}}):null,
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
