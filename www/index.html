<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Backgammon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #1a0e07; }
    #root {
      height: 100vh;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      display: flex;
      flex-direction: column;
    }
    #root > div { height: 100% !important; max-height: 100% !important; }
    @keyframes diceTumble {
      0%   { transform: translateY(-5px) rotate(0deg)   scale(1.04); }
      25%  { transform: translateY(-1px) rotate(90deg)  scale(1.02); }
      50%  { transform: translateY(-6px) rotate(180deg) scale(1.05); }
      75%  { transform: translateY(-2px) rotate(270deg) scale(1.03); }
      100% { transform: translateY(-5px) rotate(360deg) scale(1.04); }
    }
    @keyframes diceLand {
      0%   { transform: translateY(-8px) scale(1.10); }
      40%  { transform: translateY(3px)  scale(0.94); }
      70%  { transform: translateY(-2px) scale(1.03); }
      100% { transform: translateY(0)    scale(1); }
    }
    @keyframes checkerMove { 0%{transform:scale(1.2);opacity:0.7} 100%{transform:scale(1);opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes fadeIn { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes celebratePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="ai-worker" type="text/worker">
    /* ─── Backgammon AI Worker ─── */
    function cloneState(s){return{board:s.board.slice(),bar:[s.bar[0],s.bar[1]],off:[s.off[0],s.off[1]]}}
    function applyMove(state,from,to,player){
      var s=cloneState(state);
      if(from===-1){s.bar[player]--}else{if(player===0)s.board[from]--;else s.board[from]++}
      if(to===25||to===-2){s.off[player]++;return s}
      if(player===0){
        if(s.board[to]===-1){s.board[to]=1;s.bar[1]++}
        else s.board[to]++;
      }else{
        if(s.board[to]===1){s.board[to]=-1;s.bar[0]++}
        else s.board[to]--;
      }
      return s;
    }
    function playerCheckerAt(board,pt,player){
      if(player===0)return board[pt]>0;
      return board[pt]<0;
    }
    function countAt(board,pt,player){
      if(player===0)return Math.max(0,board[pt]);
      return Math.max(0,-board[pt]);
    }
    function canLand(board,pt,player){
      if(player===0)return board[pt]>=-1;
      return board[pt]<=1;
    }
    function allInHome(state,player){
      if(state.bar[player]>0)return false;
      if(player===0){for(var i=6;i<24;i++)if(state.board[i]>0)return false}
      else{for(var i=0;i<18;i++)if(state.board[i]<0)return false}
      return true;
    }
    function highestOccupied(state,player){
      if(player===0){for(var i=23;i>=0;i--)if(state.board[i]>0)return i;return -1}
      else{for(var i=0;i<24;i++)if(state.board[i]<0)return i;return -1}
    }
    function generateMoves(state,dice,player){
      var results=[];
      function recurse(st,remaining,moves){
        if(remaining.length===0){results.push({state:st,moves:moves});return}
        var die=remaining[0];var rest=remaining.slice(1);
        var found=false;
        if(st.bar[player]>0){
          var target=player===0?24-die:die-1;
          if(target>=0&&target<24&&canLand(st.board,target,player)){
            var ns=applyMove(st,-1,target,player);
            found=true;
            recurse(ns,rest,moves.concat([{from:-1,to:target,die:die}]));
          }
          if(!found)recurse(st,rest,moves);
          return;
        }
        var inHome=allInHome(st,player);
        var pts=[];
        for(var i=0;i<24;i++){
          if(playerCheckerAt(st.board,i,player)){
            var target;
            if(player===0)target=i-die;else target=i+die;
            if(target>=0&&target<24){
              if(canLand(st.board,target,player)){pts.push({from:i,to:target});found=true}
            } else if(inHome){
              if(player===0&&target<0){
                if(target===-1||i>=highestOccupied(st,player)){
                  pts.push({from:i,to:-2});found=true;
                }
              }
              if(player===1&&target>=24){
                if(target===24||i<=highestOccupied(st,player)){
                  pts.push({from:i,to:25});found=true;
                }
              }
            }
          }
        }
        if(!found){recurse(st,rest,moves);return}
        for(var p=0;p<pts.length;p++){
          var mv=pts[p];
          var ns=applyMove(st,mv.from,mv.to,player);
          recurse(ns,rest,moves.concat([{from:mv.from,to:mv.to,die:die}]));
        }
      }
      var diceList=dice.slice();
      recurse(state,diceList,[]);
      if(diceList.length===2&&diceList[0]!==diceList[1]){
        var rev=[diceList[1],diceList[0]];
        recurse(state,rev,[]);
      }
      var maxLen=0;
      for(var i=0;i<results.length;i++){if(results[i].moves.length>maxLen)maxLen=results[i].moves.length}
      results=results.filter(function(r){return r.moves.length===maxLen});
      /* Backgammon rule: if only 1 die can be played and dice differ, must use larger die */
      if(maxLen===1&&diceList.length===2&&diceList[0]!==diceList[1]){
        var maxDie=Math.max(diceList[0],diceList[1]);
        var withLarger=results.filter(function(r){return r.moves[0]&&r.moves[0].die===maxDie});
        if(withLarger.length>0)results=withLarger;
      }
      var seen={};var unique=[];
      for(var i=0;i<results.length;i++){
        var key=results[i].state.board.join(',')+';'+results[i].state.bar.join(',')+';'+results[i].state.off.join(',');
        if(!seen[key]){seen[key]=true;unique.push(results[i])}
      }
      return unique;
    }
    function pipCount(state,player){
      var count=0;
      if(player===0){
        count+=state.bar[0]*25;
        for(var i=0;i<24;i++)if(state.board[i]>0)count+=state.board[i]*(i+1);
      }else{
        count+=state.bar[1]*25;
        for(var i=0;i<24;i++)if(state.board[i]<0)count+=(-state.board[i])*(24-i);
      }
      return count;
    }
    function hitProb(board,blotIdx,player){
      var opp=1-player;var hits=0;
      for(var d1=1;d1<=6;d1++){
        for(var d2=1;d2<=6;d2++){
          var dists=[d1,d2,d1+d2];
          if(d1===d2){dists.push(d1*3);dists.push(d1*4)}
          var hit=false;
          for(var k=0;k<dists.length;k++){
            var dist=dists[k];var from;
            if(opp===0)from=blotIdx+dist;else from=blotIdx-dist;
            if(from>=0&&from<24){
              if(opp===0&&board[from]>0){hit=true;break}
              if(opp===1&&board[from]<0){hit=true;break}
            }
          }
          if(hit)hits++;
        }
      }
      return hits/36;
    }
    /* ─── Anchor quality lookup: opponent's point (1-6) → value ─── */
    var ANCHOR_VAL=[1,3,6,14,18,10]; /* 1pt,2pt,3pt,4pt,5pt(golden),bar-pt */

    /* ─── Enhanced hit probability with indirect shots ─── */
    function hitProbFull(board,blotIdx,player){
      var opp=1-player;var hits=0;
      for(var d1=1;d1<=6;d1++){for(var d2=1;d2<=6;d2++){
        var hit=false;
        /* Direct shots */
        var dists=[d1,d2,d1+d2];
        if(d1===d2){dists.push(d1*3);dists.push(d1*4)}
        for(var k=0;k<dists.length;k++){
          var dist=dists[k];var from;
          if(opp===0)from=blotIdx+dist;else from=blotIdx-dist;
          if(from>=0&&from<24){
            if(opp===0&&board[from]>0){hit=true;break}
            if(opp===1&&board[from]<0){hit=true;break}
          }
        }
        /* Indirect (combination) shots: src→mid→blot */
        if(!hit&&d1!==d2){
          var combos=[[d1,d2],[d2,d1]];
          for(var c=0;c<combos.length;c++){
            var a=combos[c][0],b=combos[c][1];
            /* Check all opponent checkers that could use a+b path */
            for(var src=0;src<24;src++){
              if(!playerCheckerAt(board,src,opp))continue;
              var mid;
              if(opp===0)mid=src-a;else mid=src+a;
              if(mid<0||mid>=24)continue;
              if(!canLand(board,mid,opp))continue;
              var dest;
              if(opp===0)dest=mid-b;else dest=mid+b;
              if(dest===blotIdx){hit=true;break}
            }
            if(hit)break;
          }
        }
        if(hit)hits++;
      }}
      return hits/36;
    }

    /* ─── Contact detection helper ─── */
    /* Contact = the two armies haven't fully passed each other.
       White moves high→low, black moves low→high, so contact exists when
       the highest white index is still > the lowest black index. */
    function hasContact(state){
      if(state.bar[0]>0||state.bar[1]>0)return true;
      var maxWhite=-1;
      for(var i=23;i>=0;i--)if(state.board[i]>0){maxWhite=i;break}
      var minBlack=24;
      for(var i=0;i<24;i++)if(state.board[i]<0){minBlack=i;break}
      return maxWhite>minBlack;
    }

    /* ─── Race Evaluator ─── */
    function evaluateRace(state,player){
      var opp=1-player;
      var myPip=pipCount(state,player);
      var oppPip=pipCount(state,opp);
      var score=0;
      /* Pip count advantage */
      score+=(oppPip-myPip)*1.4;
      /* Bearing off bonus */
      score+=state.off[player]*14;score-=state.off[opp]*14;
      /* Wastage: checkers stacked on low points waste high dice */
      for(var i=0;i<24;i++){
        var cnt=countAt(state.board,i,player);
        if(cnt<=0)continue;
        /* Point value from player's perspective (1-24, lower=closer to bearing off) */
        var ptVal=player===0?(i+1):(24-i);
        if(ptVal<=6){
          /* Home board: penalize stacking beyond 2 */
          if(cnt>2)score-=(cnt-2)*(7-ptVal)*1.5;
        }
        /* General stacking penalty */
        if(cnt>3)score-=(cnt-3)*6;if(cnt>4)score-=(cnt-4)*8;if(cnt>5)score-=(cnt-5)*12;
      }
      /* Smooth distribution bonus: count gaps in home board */
      var gaps=0;
      if(player===0){for(var i=0;i<6;i++)if(state.board[i]<=0)gaps++}
      else{for(var i=18;i<24;i++)if(state.board[i]>=0)gaps++}
      if(gaps<=1)score+=5; /* nearly smooth */
      /* Crossover penalty: checkers outside home board */
      for(var i=0;i<24;i++){
        var cnt=countAt(state.board,i,player);
        if(cnt<=0)continue;
        var ptVal=player===0?(i+1):(24-i);
        if(ptVal>6)score-=cnt*Math.floor((ptVal-1)/6)*2; /* per quadrant crossed */
      }
      return score;
    }

    /* ─── Contact Evaluator ─── */
    function evaluateContact(state,player){
      var opp=1-player;
      var myPip=pipCount(state,player);
      var oppPip=pipCount(state,opp);
      var score=0;
      /* Pip count (less important in contact) */
      score+=(oppPip-myPip)*0.4;
      score+=state.off[player]*15;score-=state.off[opp]*15;
      /* Bar penalties */
      score-=state.bar[player]*28;score+=state.bar[opp]*20;
      /* Blot exposure with enhanced hit probability.
         Position weight reflects COST of being hit (pips lost going to bar): closer to home = higher cost.
         Your own outer board (7-12) is most punishing if hit (deep loss + high reachability). */
      var blotCount=0;
      for(var i=0;i<24;i++){
        if(player===0&&state.board[i]===1){
          blotCount++;
          var prob=hitProbFull(state.board,i,0);
          var ptVal=i+1;
          var pw;
          if(ptVal<=6){pw=ptVal===5?2.0:ptVal===4?1.8:ptVal===6?1.5:1.0}
          else if(ptVal<=12){pw=1.8} /* YOUR outer: high cost if hit + high reachability */
          else if(ptVal<=18){pw=0.9} /* opp outer: lower cost (less pips lost) */
          else{pw=0.4} /* opp home: minimal cost */
          score-=prob*pw*22;
        }else if(player===1&&state.board[i]===-1){
          blotCount++;
          var prob=hitProbFull(state.board,i,1);
          var oppPtVal=24-i;
          var pw;
          if(oppPtVal<=6){pw=oppPtVal===5?2.0:oppPtVal===4?1.8:oppPtVal===6?1.5:1.0}
          else if(oppPtVal<=12){pw=1.8}
          else if(oppPtVal<=18){pw=0.9}
          else{pw=0.4}
          score-=prob*pw*22;
        }
      }
      /* Multiple blots penalty: each additional blot is progressively worse */
      if(blotCount>=2)score-=(blotCount-1)*8;
      if(blotCount>=3)score-=(blotCount-2)*10;
      /* Bonus for making points in key building range (5-11 from player perspective).
         The bar point (7), 5-point, 4-point and outer board points are valuable for blocking. */
      if(player===0){
        for(var i=4;i<11;i++){ /* points 5-11 */
          if(state.board[i]>=2){
            var ptValue=i+1;
            /* Higher bonus for the most blocking points: 5(golden), 7(bar), 8 */
            var pointBonus=ptValue===5?6:ptValue===7?6:ptValue===8?5:ptValue===6?4:3;
            score+=pointBonus;
          }
        }
      }else{
        for(var i=13;i<20;i++){ /* opp's points 5-11 */
          if(state.board[i]<=-2){
            var oppPtValue=24-i;
            var pointBonus=oppPtValue===5?6:oppPtValue===7?6:oppPtValue===8?5:oppPtValue===6?4:3;
            score+=pointBonus;
          }
        }
      }
      /* Prime detection */
      var consecutive=0;var bestPrime=0;var primeStart=-1;
      for(var i=0;i<24;i++){
        if(countAt(state.board,i,player)>=2){consecutive++;if(consecutive>bestPrime){bestPrime=consecutive;primeStart=i-consecutive+1}}
        else consecutive=0;
      }
      if(bestPrime>=2)score+=bestPrime*bestPrime*5;
      if(bestPrime>=3){
        var trapped=0;
        for(var i=0;i<24;i++){
          if(countAt(state.board,i,opp)>0){
            if(player===0&&i>primeStart+bestPrime-1)trapped+=countAt(state.board,i,opp);
            if(player===1&&i<primeStart)trapped+=countAt(state.board,i,opp);
          }
        }
        score+=trapped*bestPrime*3;
      }
      /* Home board points */
      var homePoints=0;
      if(player===0){for(var i=0;i<6;i++)if(state.board[i]>=2)homePoints++}
      else{for(var i=18;i<24;i++)if(state.board[i]<=-2)homePoints++}
      var homeMultiplier=state.bar[opp]>0?10:6;
      score+=homePoints*homeMultiplier;
      if(homePoints===6)score+=25;
      /* Anchor quality hierarchy */
      if(player===0){for(var i=18;i<24;i++)if(state.board[i]>=2){var oppPt=24-i;score+=ANCHOR_VAL[oppPt-1]}}
      else{for(var i=0;i<6;i++)if(state.board[i]<=-2){score+=ANCHOR_VAL[i]}}
      /* Stacking penalty */
      for(var i=0;i<24;i++){var cnt=countAt(state.board,i,player);if(cnt>3)score-=(cnt-3)*6;if(cnt>4)score-=(cnt-4)*8;if(cnt>5)score-=(cnt-5)*12}
      /* Builder bonus */
      if(player===0){for(var i=4;i<12;i++)if(state.board[i]===3)score+=3}
      else{for(var i=12;i<20;i++)if(-state.board[i]===3)score+=3}
      return score;
    }

    /* ─── Master Evaluator: dispatches to race or contact ─── */
    function evaluateMaster(state,player){
      var isRace=!hasContact(state)&&state.bar[0]===0&&state.bar[1]===0;
      if(isRace)return evaluateRace(state,player);
      var base=evaluateContact(state,player);
      /* Extra prime bonus for 4+ primes */
      var consecutive=0;var bestPrime=0;
      for(var i=0;i<24;i++){
        if(countAt(state.board,i,player)>=2){consecutive++;if(consecutive>bestPrime)bestPrime=consecutive}
        else consecutive=0;
      }
      if(bestPrime>=4)base+=bestPrime*bestPrime*2;
      return base;
    }

    /* ─── Basic evaluator for Rookie/Sharp ─── */
    function evaluateState(state,player){
      var isRace=!hasContact(state)&&state.bar[0]===0&&state.bar[1]===0;
      if(isRace)return evaluateRace(state,player);
      return evaluateContact(state,player);
    }

    /* ─── Monte Carlo Rollouts ─── */
    function pickRolloutMove(state,dice,player){
      var moves=generateMoves(state,dice,player);
      if(moves.length===0)return null;
      if(moves.length===1)return moves[0];
      var best=moves[0];var bestSc=-Infinity;
      for(var i=0;i<moves.length;i++){
        var sc=evaluateMaster(moves[i].state,player)+Math.random()*4;
        if(sc>bestSc){bestSc=sc;best=moves[i]}
      }
      return best;
    }
    function rolloutResult(startState,nextPlayer,maxDepth){
      var cur=cloneState(startState);
      var p=nextPlayer;
      for(var t=0;t<maxDepth;t++){
        if(cur.off[0]>=15)return 0;
        if(cur.off[1]>=15)return 1;
        var d1=Math.floor(Math.random()*6)+1;
        var d2=Math.floor(Math.random()*6)+1;
        var dl=d1===d2?[d1,d1,d1,d1]:[d1,d2];
        var result=pickRolloutMove(cur,dl,p);
        if(result)cur=result.state;
        p=1-p;
      }
      return pipCount(cur,0)<pipCount(cur,1)?0:1;
    }
    function searchMC(state,dice,player,rollouts,topCandidates,maxDepth){
      var allMoves=generateMoves(state,dice,player);
      if(allMoves.length===0)return null;
      if(allMoves.length===1)return allMoves[0];
      var scored=[];
      for(var i=0;i<allMoves.length;i++){
        scored.push({idx:i,sc:evaluateMaster(allMoves[i].state,player)});
      }
      scored.sort(function(a,b){return b.sc-a.sc});
      var topN=Math.min(topCandidates||4,scored.length);
      var bestMove=null;var bestWinCount=-1;
      for(var c=0;c<topN;c++){
        var move=allMoves[scored[c].idx];
        var myWins=0;
        for(var i=0;i<rollouts;i++){
          var winner=rolloutResult(move.state,1-player,maxDepth||60);
          if(winner===player)myWins++;
        }
        if(myWins>bestWinCount){bestWinCount=myWins;bestMove=move}
      }
      return bestMove;
    }

    /* ─── 2-Ply Search (kept for fallback) ─── */
    function search2Ply(state,dice,player){
      var opp=1-player;
      var allMoves=generateMoves(state,dice,player);
      if(allMoves.length===0)return null;
      if(allMoves.length===1)return allMoves[0];
      /* Score at 0-ply and take top 8 */
      var scored=[];
      for(var i=0;i<allMoves.length;i++){
        scored.push({idx:i,sc:evaluateMaster(allMoves[i].state,player)});
      }
      scored.sort(function(a,b){return b.sc-a.sc});
      var topN=Math.min(8,scored.length);
      /* 21 distinct dice rolls: (1,1)..(6,6) doubles weight 1, non-doubles weight 2 */
      var ROLLS=[];
      for(var d1=1;d1<=6;d1++){for(var d2=d1;d2<=6;d2++){
        var w=d1===d2?1:2;
        var dl=d1===d2?[d1,d1,d1,d1]:[d1,d2];
        ROLLS.push({dice:dl,weight:w});
      }}
      var bestMove=null;var bestAvg=-Infinity;
      for(var c=0;c<topN;c++){
        var cand=allMoves[scored[c].idx];
        var totalScore=0;
        for(var r=0;r<ROLLS.length;r++){
          var roll=ROLLS[r];
          var oppMoves=generateMoves(cand.state,roll.dice,opp);
          /* Opponent picks their best response */
          var oppBestScore=-Infinity;var oppBestState=cand.state;
          if(oppMoves.length===0){
            oppBestState=cand.state;
            oppBestScore=evaluateMaster(cand.state,player);
          }else{
            /* If too many opponent moves, prune to top 15 */
            var evalPool=oppMoves;
            if(oppMoves.length>15){
              var oppScored=[];
              for(var m=0;m<oppMoves.length;m++)oppScored.push({idx:m,sc:evaluateMaster(oppMoves[m].state,opp)});
              oppScored.sort(function(a,b){return b.sc-a.sc});
              evalPool=[];for(var m=0;m<15;m++)evalPool.push(oppMoves[oppScored[m].idx]);
            }
            for(var m=0;m<evalPool.length;m++){
              var sc=evaluateMaster(evalPool[m].state,opp);
              if(sc>oppBestScore){oppBestScore=sc;oppBestState=evalPool[m].state}
            }
            /* Evaluate from player's perspective after opponent's best response */
            oppBestScore=evaluateMaster(oppBestState,player);
          }
          totalScore+=oppBestScore*roll.weight;
        }
        var avg=totalScore/36;
        if(avg>bestAvg){bestAvg=avg;bestMove=cand}
      }
      return bestMove;
    }

    /* ─── Worker Message Handler ─── */
    self.onmessage=function(e){
      var d=e.data;var state=d.state;var dice=d.dice;var player=d.player;var difficulty=d.difficulty;
      var allMoves=generateMoves(state,dice,player);
      if(allMoves.length===0){self.postMessage({moves:[],state:state});return}
      if(allMoves.length===1){self.postMessage({moves:allMoves[0].moves,state:allMoves[0].state});return}
      /* Rookie: random with hit bias */
      if(difficulty==='rookie'){
        var hitMoves=allMoves.filter(function(m){return m.state.bar[1-player]>state.bar[1-player]});
        var pool=hitMoves.length>0&&Math.random()<0.4?hitMoves:allMoves;
        var pick=pool[Math.floor(Math.random()*pool.length)];
        self.postMessage({moves:pick.moves,state:pick.state});return;
      }
      /* Master: Monte Carlo rollouts (12 rollouts × 4 candidates = 48 rollouts) */
      if(difficulty==='master'){

    function hasContactMT(state){

    /* ─── Race Evaluator (main thread) ─── */

    /* ─── Main thread evaluator (dispatches race/contact) ─── */
    function evaluateStateV2(state,player){

      return evaluateContactMT(state,player);

    /* ─── Monte Carlo Rollouts (main thread, for training mode) ─── */
    function pickRolloutMoveMT(state,dice,player){
      const moves=generateMoves(state,dice,player);
      if(moves.length===0)return null;
      if(moves.length===1)return moves[0];
      let best=moves[0];let bestSc=-Infinity;
      for(const m of moves){
        const sc=evaluateStateV2(m.state,player)+Math.random()*4;
        if(sc>bestSc){bestSc=sc;best=m}
      }
      return best;
    }
    function rolloutResultMT(startState,nextPlayer,maxDepth){
      let cur=cloneState(startState);
      let p=nextPlayer;
      for(let t=0;t<maxDepth;t++){
        if(cur.off[0]>=15)return 0;
        if(cur.off[1]>=15)return 1;
        const d1=Math.floor(Math.random()*6)+1;
        const d2=Math.floor(Math.random()*6)+1;
        const dl=d1===d2?[d1,d1,d1,d1]:[d1,d2];
        const r=pickRolloutMoveMT(cur,dl,p);
        if(r)cur=r.state;
        p=1-p;
      }
      return pipCount(cur,0)<pipCount(cur,1)?0:1;
    }
    /* Returns [{move, winRate, rollouts}] for top candidates */
    function rolloutCandidates(state,dice,player,rollouts,topCandidates,maxDepth){
      const allMoves=generateMoves(state,dice,player);
      if(allMoves.length===0)return [];
      const scored=allMoves.map((m,i)=>({m,sc:evaluateStateV2(m.state,player),idx:i}));
      scored.sort((a,b)=>b.sc-a.sc);
      const topN=Math.min(topCandidates,scored.length);
      const results=[];
      for(let c=0;c<topN;c++){
        const move=scored[c].m;
        let myWins=0;
        for(let i=0;i<rollouts;i++){
          const winner=rolloutResultMT(move.state,1-player,maxDepth||60);
          if(winner===player)myWins++;
        }
        results.push({move,winRate:myWins/rollouts,rollouts,staticScore:scored[c].sc});
      }
      results.sort((a,b)=>b.winRate-a.winRate);
      return results;
    }

    /* ─── Win Probability Estimation ─── */
    function estimateWinProb(state,player){
      const score=evaluateStateV2(state,player);
      return 1/(1+Math.exp(-score/30));
    }

    /* ─── Gammon Probability Estimation ─── */
    function estimateGammonProb(state,player){
      const opp=1-player;
      if(state.off[opp]>0)return 0.02;
      let prob=0.15;
      prob+=state.bar[opp]*0.10;
      if(state.off[player]>=5)prob+=0.10;
      if(state.off[player]>=10)prob+=0.10;
      let con=0,bp=0;
      for(let i=0;i<24;i++){if(countAt(state.board,i,player)>=2){con++;if(con>bp)bp=con}else con=0}
      if(bp>=4)prob+=0.15;
      const myPip=pipCount(state,player);const oppPip=pipCount(state,opp);
      if(oppPip>myPip*1.5)prob+=0.10;
      return Math.min(prob,0.60);
    }

    /* ─── Match Equity Table (16x16, Kazaross-XG2 approximation) ─── */
    const MET=[];
    (function(){
      for(let i=0;i<=15;i++){MET[i]=[];for(let j=0;j<=15;j++){
        if(i===0)MET[i][j]=1.0;
        else if(j===0)MET[i][j]=0.0;

          MET[i][j]=Math.max(0.02,Math.min(0.98,0.5+0.076*(j-i)));
        }
      }}
    })();

    /* ─── Doubling Decision Functions ─── */
    function shouldDouble(state,player,matchScore,matchLength,cubeValue,cubeOwner,crawford){
      if(crawford)return false;
      if(cubeOwner!==-1&&cubeOwner!==player)return false;
      /* Match-aware cap: a single game can never be worth more than the
         match, so doubling past matchLength is pointless (this is why the
         cube could absurdly run to 64 in a 5-point match). 64 kept as an
         absolute backstop for any non-match mode. */
      if(cubeValue>=64||cubeValue>=matchLength)return false;

      /* Small jitter to avoid predictability */
      return effectiveWin>=(0.67+Math.random()*0.03);
    }
    function shouldTake(state,player,cubeValue){
      const wp=estimateWinProb(state,player);
      const gpAgainst=estimateGammonProb(state,1-player);
      return wp>=(0.22+gpAgainst*0.15);
    }

    /* ─── Training Analysis ─── */
    function analyzeMoves(state,dice,player){
      const allMoves=generateMoves(state,dice,player);
      if(allMoves.length===0)return{moves:[],best:null,confidence:null,isOpening:false};
      const isOpening=player===0&&isOpeningPosition(state);
      let openingMove=null;
      if(isOpening)openingMove=getOpeningMove(dice);
      const scored=allMoves.map((m,idx)=>{
        const sc=evaluateStateV2(m.state,player);
        const tags=[];
        const hits=m.moves.filter(mv=>mv.to>=0&&mv.to<24&&(
          (player===0&&state.board[mv.to]===-1)||(player===1&&state.board[mv.to]===1)
        ));
        if(hits.length>0)tags.push({label:'HIT',color:'#e74c3c',bg:'#3a1818'});
        if(m.moves.some(mv=>mv.to===-2||mv.to===25))tags.push({label:'BEAR OFF',color:'#f0c040',bg:'#3a3018'});
        let con=0,best=0;
        for(let i=0;i<24;i++){if(countAt(m.state.board,i,player)>=2){con++;if(con>best)best=con}else con=0}
        let oldCon=0,oldBest=0;
        for(let i=0;i<24;i++){if(countAt(state.board,i,player)>=2){oldCon++;if(oldCon>oldBest)oldBest=oldCon}else oldCon=0}
        if(best>oldBest&&best>=3)tags.push({label:'PRIME',color:'#9b59b6',bg:'#2a1830'});
        let blots=0;
        for(let i=0;i<24;i++){if(player===0&&m.state.board[i]===1)blots++;if(player===1&&m.state.board[i]===-1)blots++}
        let oldBlots=0;
        for(let i=0;i<24;i++){if(player===0&&state.board[i]===1)oldBlots++;if(player===1&&state.board[i]===-1)oldBlots++}
        if(blots>oldBlots)tags.push({label:'EXPOSED',color:'#e67e22',bg:'#302010'});
        if(blots<oldBlots)tags.push({label:'SAFE',color:'#27ae60',bg:'#1a3018'});
        let hp=0,ohp=0;
        if(player===0){for(let i=0;i<6;i++){if(m.state.board[i]>=2)hp++;if(state.board[i]>=2)ohp++}}
        if(hp>ohp)tags.push({label:'ANCHOR',color:'#3498db',bg:'#182a38'});
        /* MAKE POINT: detect newly-made points in the building range (5-11) */
        let madeOuterPoint=false;
        if(player===0){
          for(let i=4;i<11;i++){
            if(m.state.board[i]>=2&&state.board[i]<2){madeOuterPoint=true;break}
          }
        }else{
          for(let i=13;i<20;i++){
            if(m.state.board[i]<=-2&&state.board[i]>-2){madeOuterPoint=true;break}
          }
        }
        if(madeOuterPoint)tags.push({label:'MAKE POINT',color:'#2ecc71',bg:'#0f2818'});
        const slots=m.moves.filter(mv=>mv.to>=0&&mv.to<24&&countAt(m.state.board,mv.to,player)===1);
        if(slots.length>0&&tags.every(t=>t.label!=='EXPOSED'))tags.push({label:'SLOT',color:'#8e44ad',bg:'#281830'});
        let isBookMove=false;
        if(openingMove){
          const bookSet=openingMove.map(bm=>bm.from+'>'+bm.to).sort().join(',');
          const thisSet=m.moves.map(mv=>mv.from+'>'+mv.to).sort().join(',');
          if(bookSet===thisSet)isBookMove=true;
        }
        if(isBookMove)tags.unshift({label:'BOOK',color:'#f0c040',bg:'#3a3018'});
        return{...m,score:sc,tags,idx,isBookMove};
      });
      scored.sort((a,b)=>b.score-a.score);
      if(openingMove){
        const bookIdx=scored.findIndex(s=>s.isBookMove);
        if(bookIdx>0){const bookMove=scored.splice(bookIdx,1)[0];scored.unshift(bookMove)}
      }
      /* For non-opening positions: re-rank top candidates by Monte Carlo rollouts */
      let usedRollouts=false;
      let totalRollouts=0;
      if(!openingMove&&scored.length>=2){
        const ROLLOUTS_PER_MOVE=40;
        const TOP_N=Math.min(6,scored.length);
        const rolloutResults=[];
        for(let c=0;c<TOP_N;c++){
          const mv=scored[c];
          let myWins=0;
          for(let i=0;i<ROLLOUTS_PER_MOVE;i++){
            const winner=rolloutResultMT(mv.state,1-player,60);
            if(winner===player)myWins++;
          }
          rolloutResults.push({...mv,winRate:myWins/ROLLOUTS_PER_MOVE,rollouts:ROLLOUTS_PER_MOVE});
        }
        rolloutResults.sort((a,b)=>b.winRate-a.winRate);
        /* Replace top N in scored with rollout-ranked versions */
        for(let c=0;c<TOP_N;c++)scored[c]=rolloutResults[c];
        usedRollouts=true;
        totalRollouts=ROLLOUTS_PER_MOVE*TOP_N;
      }
      let confidence=null;
      if(scored.length>=2){
        if(isOpening&&scored[0].isBookMove){
          confidence={level:'high',label:'Book Move',color:'#f0c040',detail:'Established best play per computer rollout analysis'};
        }else if(usedRollouts){
          /* Confidence based on win rate gap */
          const wr1=scored[0].winRate||0;const wr2=scored[1].winRate||0;
          const wrGap=wr1-wr2;
          if(wrGap>=0.15){
            confidence={level:'high',label:'Clear Best',color:'#27ae60',detail:'Best move wins '+Math.round(wr1*100)+'% vs #2: '+Math.round(wr2*100)+'%'};
          }else if(wrGap>=0.06){
            confidence={level:'medium',label:'Slight Edge',color:'#e67e22',detail:Math.round(wr1*100)+'% vs '+Math.round(wr2*100)+'% ('+totalRollouts+' rollouts)'};
          }else{
            confidence={level:'low',label:'Close Call',color:'#e74c3c',detail:'Top moves nearly equal: '+Math.round(wr1*100)+'% vs '+Math.round(wr2*100)+'%'};
          }
        }else{
          const gap=scored[0].score-scored[1].score;
          const maxScore=Math.max(Math.abs(scored[0].score),1);
          const relGap=gap/maxScore;
          if(relGap>0.15||gap>15){
            confidence={level:'high',label:'Clear Best',color:'#27ae60',detail:'Best move leads by '+Math.round(gap)+' points'};
          }else if(relGap>0.05||gap>5){
            confidence={level:'medium',label:'Slight Edge',color:'#e67e22',detail:'Top moves differ by only '+Math.round(gap)+' points'};
          }else{
            confidence={level:'low',label:'Close Call',color:'#e74c3c',detail:'Several moves score nearly equal (gap: '+Math.round(gap)+')'};
          }
        }
      }else if(scored.length===1){
        confidence={level:'high',label:'Only Move',color:'#27ae60',detail:'Only one legal move available'};
      }
      return{moves:scored,best:scored[0],confidence,isOpening,usedRollouts,totalRollouts};
    }

    /* ─── Server-based Analysis (expert backgammon engine) ─── */
    /* Set this to your deployed Fly.io URL after deploying the server.
       Example: 'https://backgammon-ai.fly.dev'
       Leave empty to disable server analysis (uses local rollouts only). */
    const ANALYSIS_SERVER_URL='https://esbro-bg-ai.fly.dev';

    /* Convert our state {board[24], bar[2], off[2]} to bgweb-api format.
       bgweb-api uses per-player point counts: { x: {1: n, 2: n, ...}, o: {1: n, ...} }
       'x' is the player on roll. We always pass our state with player as 'x'. */
    function toBgwebBoard(state,player){
      const x={};const o={};
      /* For player 0: their point N (1-24) corresponds to board index (N-1).
         For player 1: their point N corresponds to board index (24-N). */
      for(let i=0;i<24;i++){
        const v=state.board[i];
        if(v===0)continue;
        if(player===0){
          /* Our player 0 = bgweb's 'x' */
          if(v>0){x[String(i+1)]=v}
          else{o[String(24-i)]=-v}
        }else{
          /* Our player 1 = bgweb's 'x' (we pass state from p1 perspective) */
          if(v<0){x[String(24-i)]=-v}
          else{o[String(i+1)]=v}
        }
      }
      /* Bar: bgweb uses point "bar" — but in CheckerLayout it's just 25 in some versions.
         We use the openapi standard: not always defined, omit if 0 */
      const myBar=player===0?state.bar[0]:state.bar[1];
      const oppBar=player===0?state.bar[1]:state.bar[0];
      if(myBar>0)x['bar']=myBar;
      if(oppBar>0)o['bar']=oppBar;
      return{x,o};
    }

    /* Convert bgweb-api move (from/to as point numbers) back to our format (board indices).
       For player 0: from index = (fromPoint - 1), to index = (toPoint - 1)
       For player 1: from index = (24 - fromPoint), to index = (24 - toPoint)
       BAR/off handled specially. */
    function fromBgwebMove(from,to,player){
      let fromIdx,toIdx;
      if(from==='bar')fromIdx=-1;
      else if(player===0)fromIdx=parseInt(from,10)-1;
      else fromIdx=24-parseInt(from,10);
      if(to==='off')toIdx=player===0?-2:25;
      else if(player===0)toIdx=parseInt(to,10)-1;
      else toIdx=24-parseInt(to,10);
      return{from:fromIdx,to:toIdx};
    }

    /* Returns final state after applying a sequence of moves */
    function applyMovesSequence(state,moves,player){
      let s=state;
      for(const mv of moves){
        s=applyMove(s,mv.from,mv.to,player);
      }
      return s;
    }

    /* In-memory cache for server analysis: key = positionHash + dice */
    const serverAnalysisCache=new Map();
    function cacheKey(state,dice,player){
      return state.board.join(',')+';'+state.bar.join(',')+';'+state.off.join(',')+';'+dice.slice().sort().join('-')+';p'+player;
    }

    /* Async: get analysis from server. Returns null on failure. */
    async function analyzeMovesServer(state,dice,player){
      if(!ANALYSIS_SERVER_URL)return null;
      const k=cacheKey(state,dice,player);
      if(serverAnalysisCache.has(k))return serverAnalysisCache.get(k);
      try{
        const board=toBgwebBoard(state,player);
        const body={
          board,
          dice:[dice[0],dice[1]||dice[0]], /* doubles use 4 dice but bgweb expects 2 */
          player:'x',
          'max-moves':6,
          'score-moves':true,
          cubeful:false,
        };
        const ctrl=new AbortController();
        /* 15s, not 5s: a hibernated Fly machine takes ~6-8s to cold-start
           (VM wake + gnubg boot + Caddy). The UI already shows local
           analysis instantly and upgrades when the server replies, so a
           longer timeout has no UX cost — it just lets the cold-start
           result actually arrive instead of aborting first. */
        const timeoutId=setTimeout(()=>ctrl.abort(),15000);
        const resp=await fetch(ANALYSIS_SERVER_URL+'/api/v1/getmoves',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body),
          signal:ctrl.signal,
        });
        clearTimeout(timeoutId);
        if(!resp.ok)throw new Error('Server returned '+resp.status);
        const data=await resp.json();
        if(!Array.isArray(data)||data.length===0)return null;
        /* Convert each bgweb move to our format */
        const scored=data.map((m,idx)=>{
          const ourMoves=m.play.map(p=>fromBgwebMove(p.from,p.to,player));
          const finalState=applyMovesSequence(state,ourMoves,player);
          const eq=m.evaluation?.eq||0;
          const prob=m.evaluation?.probability||{};
          const winRate=(prob.win||0.5);
          const tags=[];
          if(idx===0)tags.push({label:'EXPERT',color:'#3498db',bg:'#0e2a40'});
          /* Add basic tags by inspecting the move */
          if(ourMoves.some(mv=>mv.to===-2||mv.to===25))tags.push({label:'BEAR OFF',color:'#f0c040',bg:'#3a3018'});
          const wasHit=ourMoves.some(mv=>mv.to>=0&&mv.to<24&&(
            (player===0&&state.board[mv.to]===-1)||(player===1&&state.board[mv.to]===1)
          ));
          if(wasHit)tags.push({label:'HIT',color:'#e74c3c',bg:'#3a1818'});
          return{
            moves:ourMoves,state:finalState,score:eq*100,
            tags,winRate,equity:eq,probability:prob,idx,
          };
        });
        let confidence=null;
        if(scored.length>=2){
          const eqGap=scored[0].equity-scored[1].equity;
          if(eqGap>=0.05){
            confidence={level:'high',label:'Clear Best',color:'#27ae60',detail:'Equity advantage: +'+eqGap.toFixed(3)};
          }else if(eqGap>=0.015){
            confidence={level:'medium',label:'Slight Edge',color:'#e67e22',detail:'Small equity advantage: +'+eqGap.toFixed(3)};
          }else{
            confidence={level:'low',label:'Close Call',color:'#e74c3c',detail:'Equity nearly equal'};
          }
        }
        const result={moves:scored,best:scored[0],confidence,isOpening:false,usedRollouts:false,usedServer:true};
        serverAnalysisCache.set(k,result);
        if(serverAnalysisCache.size>100){
          /* Trim cache to last 50 */
          const keys=Array.from(serverAnalysisCache.keys()).slice(0,-50);
          for(const dk of keys)serverAnalysisCache.delete(dk);
        }
        return result;
      }catch(e){
        console.warn('Server analysis failed:',e.message);
        return null;
      }
    }

    /* Combined analysis: try server first, fall back to local rollouts */
    async function analyzeMovesAsync(state,dice,player,useServer){
      if(useServer&&ANALYSIS_SERVER_URL){
        const serverResult=await analyzeMovesServer(state,dice,player);
        if(serverResult)return serverResult;
      }
      return analyzeMoves(state,dice,player);
    }

    function getStrategyExplanation(analysis,state,player){
      if(!analysis.best)return['No legal moves available.'];
      const b=analysis.best;
      const tags=b.tags.map(t=>t.label);
      const moves=b.moves;
      const reasons=[];
      const opp=1-player;
      if(tags.includes('BOOK')){
        const makePoint=moves.length===2&&moves[0].to===moves[1].to;
        if(makePoint){
          const ptName=moves[0].to+1;
          const pointNames={5:'5-point (the most valuable point)',4:'4-point (a strong inner-board point)',3:'3-point (an inner-board point)',7:'bar point (blocks opponents escaping)'};
          reasons.push('Book move: Make your '+(pointNames[ptName]||ptName+'-point')+'.');
          reasons.push('Making a new point with both dice is always best when possible.');
        }else if(moves.length===1){
          const dist=moves[0].from-moves[0].to;
          if(dist===11)reasons.push('Book move: "Lover\'s Leap" — run a back checker to the midpoint.');
          else if(dist===10)reasons.push('Book move: Run a back checker to point 14.');
          else reasons.push('Book move: Run a back checker.');
        }else{
          const splitMove=moves.find(m=>m.from===23);
          const buildMove=moves.find(m=>m.from===12||m.from===7||m.from===5);
          if(splitMove&&buildMove){
            reasons.push('Book move: Split to the '+(splitMove.to+1)+'-point while building to the '+(buildMove.to+1)+'-point.');
          }else{
            reasons.push('Book move: Develop both sides of the board.');
          }
        }
        return reasons;
      }
      let contact=false;
      for(let i=0;i<24;i++){
        if(playerCheckerAt(state.board,i,player)){
          if(player===0){for(let j=i+1;j<24;j++)if(state.board[j]<0){contact=true;break}}
          else{for(let j=0;j<i;j++)if(state.board[j]>0){contact=true;break}}
        }
        if(contact)break;
      }
      const isRace=!contact&&state.bar[0]===0&&state.bar[1]===0;
      const myPip=pipCount(state,player);const oppPip=pipCount(state,opp);
      if(tags.includes('BEAR OFF')){
        const bearCount=moves.filter(m=>m.to===-2||m.to===25).length;
        if(bearCount>=2)reasons.push('Bear off '+bearCount+' checkers this turn.');
        else reasons.push('Bear off a checker to keep your race moving.');
        if(isRace){
          const pipLead=oppPip-myPip;
          if(pipLead>0)reasons.push('You\'re leading the race by '+pipLead+' pips.');
          else if(pipLead<0)reasons.push('You\'re behind by '+(-pipLead)+' pips.');
        }
        const resultOff=b.state.off[player];const remaining=15-resultOff;
        if(remaining<=4)reasons.push('Only '+remaining+' checker'+(remaining===1?'':'s')+' left to bear off.');
        return reasons;
      }
      if(tags.includes('HIT')){
        const hitPoints=moves.filter(mv=>mv.to>=0&&mv.to<24&&(
          (player===0&&state.board[mv.to]===-1)||(player===1&&state.board[mv.to]===1)
        ));
        const hitPt=hitPoints[0]?hitPoints[0].to+1:'';
        reasons.push('Hit the opponent\'s blot on point '+hitPt+'.');
        if(state.bar[opp]===0){
          let hp=0;
          if(player===0){for(let i=0;i<6;i++)if(state.board[i]>=2)hp++}
          else{for(let i=18;i<24;i++)if(state.board[i]<=-2)hp++}
          if(hp>=3)reasons.push('With '+hp+' home board points, re-entry will be tough for them.');
          else reasons.push('Hitting costs the opponent a full turn to re-enter.');
        }else{
          reasons.push('The opponent already has a checker on the bar — adding another makes re-entry harder.');
        }
        if(tags.includes('PRIME'))reasons.push('This also extends your prime.');
      }
      if(tags.includes('PRIME')&&!tags.includes('HIT')){
        let con=0,best=0;
        for(let i=0;i<24;i++){if(countAt(b.state.board,i,player)>=2){con++;if(con>best)best=con}else con=0}
        reasons.push('Extend your prime to '+best+' consecutive points.');
        if(best>=4)reasons.push('A '+best+'-point prime is a serious blockade.');
        else if(best===3)reasons.push('A 3-prime starts limiting the opponent\'s escape routes.');
      }
      if(tags.includes('ANCHOR')){
        let hp=0;
        if(player===0){for(let i=0;i<6;i++)if(b.state.board[i]>=2)hp++}
        reasons.push('Make a new home board point, giving you '+hp+' of 6.');
      }
      if(tags.includes('SAFE')&&reasons.length===0){
        let blotsBefore=0,blotsAfter=0;
        for(let i=0;i<24;i++){
          if(player===0){if(state.board[i]===1)blotsBefore++;if(b.state.board[i]===1)blotsAfter++}
        }
        const reduced=blotsBefore-blotsAfter;
        reasons.push('Cover '+reduced+' blot'+(reduced===1?'':'s')+', reducing your exposure.');
      }
      if(tags.includes('EXPOSED')&&reasons.length===0){
        reasons.push('This move leaves a blot, but it\'s the best option available.');
        for(const mv of moves){
          if(mv.to>=0&&mv.to<24&&countAt(b.state.board,mv.to,player)===1&&countAt(state.board,mv.to,player)!==1){
            const prob=hitProbability(b.state.board,mv.to,player);
            if(prob>0){
              reasons.push('The blot on point '+(mv.to+1)+' has a '+Math.round(prob*100)+'% chance of being hit.');
              if(prob<0.2)reasons.push('That\'s a relatively low risk.');
              else if(prob>0.4)reasons.push('That\'s high risk, but alternatives score worse.');
            }
          }
        }
      }
      if(tags.includes('SLOT')&&reasons.length===0){
        const slotted=moves.find(mv=>mv.to>=0&&mv.to<24&&countAt(b.state.board,mv.to,player)===1);
        if(slotted){
          const prob=hitProbability(b.state.board,slotted.to,player);
          reasons.push('Slot point '+(slotted.to+1)+' — place a lone checker to try to make this point next turn.');
          reasons.push('If the opponent misses ('+Math.round((1-prob)*100)+'% chance), you can cover it next turn.');
        }
      }
      if(reasons.length===0&&isRace){
        reasons.push('Pure race — move your checkers home efficiently.');
        const pipLead=oppPip-myPip;
        if(pipLead>15)reasons.push('You have a comfortable '+pipLead+'-pip lead.');
        else if(pipLead>0)reasons.push('You lead by '+pipLead+' pips.');
        else if(pipLead<0)reasons.push('You trail by '+(-pipLead)+' pips.');
      }
      if(reasons.length===0){
        if(contact){
          if(myPip<oppPip)reasons.push('Maintain your pip lead while keeping your position secure.');
          else reasons.push('Improve your position while minimizing blot exposure.');
        }else{
          reasons.push('Advance your checkers toward home.');
        }
      }
      return reasons;
    }
