# fly.toml app configuration file generated for esbro-bg-ai on 2026-05-13T22:36:57-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'esbro-bg-ai'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always running so training-mode analysis never eats a
  # 6-8s cold start (which would fall back to the weak local engine and
  # undercut the app's headline feature). The second machine still
  # auto-stops when idle and auto-starts under load.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[restart]]
  policy = 'on-failure'
  retries = 3

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
